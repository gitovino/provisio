<script>

/* ===== CORE: datamodel, voorraad, FIFO, houdbaarheid, recepten, weekplanner, OCR-parser, export ===== */
const DAY=86400000;
const COLS=['locations','products','lots','shopping','history','recipes','plan','meta'];
function pad(n){return String(n).padStart(2,'0')}
function isoUTC(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseD(s){if(!s)return null;const p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function addDays(s,n){return isoUTC(new Date(parseD(s)+n*DAY))}
function addMonths(s,n){const p=s.split('-').map(Number);const dt=new Date(Date.UTC(p[0],p[1]-1+n,1));const last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();dt.setUTCDate(Math.min(p[2],last));return isoUTC(dt)}
function daysUntil(s,ref){return Math.round((parseD(s)-parseD(ref||todayStr()))/DAY)}
function mondayOf(s){const wd=(new Date(parseD(s)).getUTCDay()+6)%7;return addDays(s,-wd)}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function rnd(n,d){d=d==null?3:d;const f=Math.pow(10,d);return Math.round((Number(n)||0)*f)/f}
function nowISO(){return new Date().toISOString()}
function clone(o){return JSON.parse(JSON.stringify(o))}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

/* ---------- Eenheden ---------- */
const UNITS=[{id:'g',label:'gram'},{id:'kg',label:'kilogram'},{id:'ml',label:'milliliter'},{id:'l',label:'liter'},{id:'stuks',label:'stuks'},{id:'verpakkingen',label:'verpakkingen'}];
const UNIT_BASE={g:['g',1],kg:['g',1000],ml:['ml',1],cl:['ml',10],l:['ml',1000],stuks:['st',1],verpakkingen:['vp',1]};
function convert(q,from,to,product){
  if(from===to)return q;const a=UNIT_BASE[from],b=UNIT_BASE[to];if(!a||!b)return null;
  if(a[0]===b[0])return q*a[1]/b[1];
  if(product&&Number(product.packSize)>0&&UNIT_BASE[product.packUnit]){
    const pu=UNIT_BASE[product.packUnit],ps=Number(product.packSize);
    const isPack=u=>u==='verpakkingen'||u==='stuks';
    if(isPack(from)&&pu[0]===b[0])return q*ps*pu[1]/b[1];
    if(isPack(to)&&pu[0]===a[0])return q*a[1]/(ps*pu[1]);
  }
  return null;
}
function fmtNum(n){n=rnd(n,2);return String(n).replace('.',',')}
function fmtQty(q,u){q=Number(q)||0;
  if(u==='g'&&q>=1000)return fmtNum(q/1000)+' kg';
  if(u==='ml'&&q>=1000)return fmtNum(q/1000)+' l';
  if(u==='stuks')return fmtNum(q)+(q===1?' stuk':' stuks');
  if(u==='verpakkingen')return fmtNum(q)+(q===1?' verpakking':' verpakkingen');
  return fmtNum(q)+' '+u}
function fmtDate(s){if(!s)return '—';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
const WEEKDAYS=['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'];
function fmtDateLong(s){const d=new Date(parseD(s));const wd=(d.getUTCDay()+6)%7;return WEEKDAYS[wd]+' '+d.getUTCDate()+'/'+pad(d.getUTCMonth()+1)}

/* ---------- Standaardlocaties & categorieën ---------- */
const DEFAULT_LOCATIONS=[
 {id:'loc-gootsteen',name:'Keukenkast Boven Gootsteen',type:'kast',icon:'🗄️',order:1},
 {id:'loc-snoep',name:'Snoepkast',type:'kast',icon:'🍫',order:2},
 {id:'loc-kruidenkast',name:'Kruidenkast',type:'kast',icon:'🌿',order:3},
 {id:'loc-kruidenrek',name:'Kruidenrek',type:'rek',icon:'🧂',order:4},
 {id:'loc-voorraad',name:'Voorraadkast droge voeding',type:'kast',icon:'🥫',order:5},
 {id:'loc-koelkast',name:'Koelkast',type:'koelkast',icon:'🥛',order:6},
 {id:'loc-dv-keuken',name:'Diepvries keuken',type:'diepvries',icon:'❄️',order:7},
 {id:'loc-dv-kelder',name:'Diepvries Kelder',type:'diepvries',icon:'🧊',order:8}];
const LOCATION_TYPES=[['kast','Kast'],['rek','Rek'],['lade','Lade'],['koelkast','Koelkast'],['diepvries','Diepvriezer'],['andere','Andere']];
const DEFAULT_CATEGORIES=[
 {id:'cat-droog',name:'Droge voeding',aisle:'Droge voeding',subs:['Pasta','Rijst','Noedels','Bloem en meel','Suiker en zoetstoffen','Granen en ontbijtproducten','Peulvruchten','Noten en zaden','Brood en beschuiten']},
 {id:'cat-conserven',name:'Conserven en sauzen',aisle:'Conserven & sauzen',subs:['Groenten in blik of bokaal','Fruit in blik of bokaal','Tomatenproducten','Sauzen','Pesto','Soepen en bouillon','Oliën en azijnen','Dressings en smaakmakers']},
 {id:'cat-kruiden',name:'Kruiden en specerijen',aisle:'Kruiden & specerijen',subs:['Gedroogde kruiden','Specerijen','Kruidenmixen','Verse kruiden',"Kruidenpasta's"]},
 {id:'cat-koeling',name:'Koeling',aisle:'Zuivel & koeling',subs:['Zuivel','Kaas','Eieren','Vleeswaren','Bereide gerechten','Sauzen en spreads']},
 {id:'cat-vlees',name:'Vlees, vis en gevogelte',aisle:'Vlees & vis',subs:['Rundvlees','Varkensvlees','Kip','Kalkoen','Gehakt','Vis','Schaaldieren','Vleesvervangers']},
 {id:'cat-gf',name:'Groenten en fruit',aisle:'Groenten & fruit',subs:['Verse groenten','Diepvriesgroenten','Vers fruit','Diepvriesfruit']},
 {id:'cat-diepvries',name:'Diepvries',aisle:'Diepvries',subs:['Vlees en gevogelte','Vis','Brood en deegwaren','Groenten','Fruit','Kant-en-klare maaltijden','Restjes en zelfbereide gerechten','IJs en desserts']},
 {id:'cat-overig',name:'Overige',aisle:'Overige',subs:['Snoep en chocolade','Koekjes','Chips en snacks','Dranken','Bakproducten','Overige voedingsmiddelen']}];
const SUB_AISLE={'Brood en beschuiten':'Brood & bakkerij','Verse kruiden':'Groenten & fruit','Diepvriesgroenten':'Diepvries','Diepvriesfruit':'Diepvries','Snoep en chocolade':'Snoep & snacks','Koekjes':'Snoep & snacks','Chips en snacks':'Snoep & snacks','Dranken':'Dranken','Bakproducten':'Bakken','Vleeswaren':'Vlees & vis','Eieren':'Zuivel & koeling'};

  freezeMonths:{'Gehakt':3,'Kip':6,'Kalkoen':6,'Rundvlees':8,'Varkensvlees':6,'Vis':4,'Schaaldieren':4,'Vlees en gevogelte':6,'Brood en deegwaren':3,'Brood en beschuiten':3,'Groenten':10,'Diepvriesgroenten':10,'Verse groenten':8,'Fruit':10,'Diepvriesfruit':10,'Vers fruit':8,'Kant-en-klare maaltijden':3,'Restjes en zelfbereide gerechten':3,'Bereide gerechten':3,'IJs en desserts':6,'Kaas':4,'Zuivel':3,'_default':6}};
/* ---------- Huishouden: kinderen en porties ---------- */
const KID_PORTIONS=[[1,0,'eet nog niet mee'],[4,0.4,'1–3 jaar'],[7,0.55,'4–6 jaar'],[11,0.7,'7–10 jaar'],[14,0.85,'11–13 jaar'],[999,1,'14 jaar of ouder']];
function ym(d){return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')}
function birthFromAge(age,ref){const t=new Date(parseD(ref||todayStr()));const d=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),1));d.setUTCMonth(d.getUTCMonth()-Math.round(Number(age)*12)-6);return ym(d)}
function childAge(birth,ref){const m=/^(\d{4})-(\d{2})/.exec(String(birth||''));if(!m)return null;const t=new Date(parseD(ref||todayStr()));const months=(t.getUTCFullYear()-Number(m[1]))*12+(t.getUTCMonth()+1-Number(m[2]));return Math.max(0,Math.floor(months/12))}
function kidPortion(age){if(age==null)return 0.55;for(const [lim,f] of KID_PORTIONS)if(age<lim)return f;return 1}
function kidBand(age){for(const [lim,,lbl] of KID_PORTIONS)if(age<lim)return lbl;return ''}
function roundHalf(n){return Math.max(1,Math.round(n*2)/2)}
function deepMerge(base,over){const out=Array.isArray(base)?base.slice():Object.assign({},base);if(over&&typeof over==='object'&&!Array.isArray(over)){for(const k in over){if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])&&base&&typeof base[k]==='object'&&base[k]&&!Array.isArray(base[k]))out[k]=deepMerge(base[k],over[k]);else out[k]=over[k]}}return out}

  m=t.match(/(\d+(?:\.\d+)?)\s*(kg|gram|gr|g|ml|cl|liter|ltr|l|stuks|st)\b/);if(m){const r=unitFromToken(m[2]);return {qty:rnd(Number(m[1])*r.f),unit:r.u}}return null}

function createModel(adapter,hooks){hooks=hooks||{};
  const S={};COLS.forEach(c=>S[c]={});const listeners=new Set();let user='Ik';let batch=0,dirty=false;
  function emit(){if(batch){dirty=true;return}listeners.forEach(f=>{try{f()}catch(e){console.error(e)}})}

  function put(col,obj){S[col][obj.id]=obj;adapter.put(col,obj);emit()}

  function applyRemote(col,id,val){if(!S[col])return;if(val==null)delete S[col][id];else S[col][id]=val;emit()}
  const settings=()=>deepMerge(DEFAULT_SETTINGS,(S.meta.settings&&S.meta.settings.value)||{});

  function effServings(){return household().servings}
  function saveSettings(patch){put('meta',{id:'settings',value:deepMerge((S.meta.settings&&S.meta.settings.value)||{},patch)})}
  const categories=()=>(S.meta.categories&&S.meta.categories.list)||clone(DEFAULT_CATEGORIES);
  function saveCategories(list){put('meta',{id:'categories',list})}
  const state=()=>(S.meta.state&&S.meta.state.value)||{};

  const isInitialized=()=>!!S.meta.schema;
  function initDefaults(){if(S.meta.schema)return;tx(()=>{DEFAULT_LOCATIONS.forEach(l=>{if(!S.locations[l.id])put('locations',Object.assign({},l))});if(!S.meta.categories)saveCategories(clone(DEFAULT_CATEGORIES));put('meta',{id:'schema',v:1,createdAt:nowISO()})})}
  const setUser=u=>{user=u||'Ik'},getUser=()=>user;
  const locations=()=>Object.values(S.locations).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));
  const products=()=>Object.values(S.products).sort((a,b)=>a.name.localeCompare(b.name,'nl'));
  const lots=()=>Object.values(S.lots).filter(l=>l.qty>0);

  const locName=id=>(S.locations[id]&&S.locations[id].name)||'Onbekende locatie';
  const isFreezer=id=>!!(S.locations[id]&&S.locations[id].type==='diepvries');
  function catAisle(cat,sub){if(sub&&SUB_AISLE[sub])return SUB_AISLE[sub];const c=categories().find(x=>x.name===cat);return (c&&c.aisle)||'Overige'}
  function levelFor(days){const t=settings().thresholds;if(days<0)return 'expired';if(days<=t.red)return 'red';if(days<=t.orange)return 'orange';if(days<=t.yellow)return 'yellow';return 'ok'}
  function lotExpiry(lot,ref){ref=ref||todayStr();const p=S.products[lot.productId]||{};
    let date=lot.expiryDate||'',type=lot.expiryDate?(lot.dateType||'THT'):'';
    if(lot.opened&&lot.openedDate&&Number(p.openShelfDays)>0&&!isFreezer(lot.locationId)){const od=addDays(lot.openedDate,Number(p.openShelfDays));if(!date||od<date){date=od;type='OPEN'}}
    if(!date)return {date:'',type:'',days:null,level:'none'};const days=daysUntil(date,ref);return {date,type,days,level:levelFor(days)}}

  function productTotal(pid,unit){const p=S.products[pid];if(!p)return 0;unit=unit||p.unit;let t=0;lotsOf(pid).forEach(l=>{const c=convert(l.qty,l.unit,unit,p);if(c!=null)t+=c});return rnd(t)}
  function productLevel(pid){const p=S.products[pid];if(!p)return null;const tot=productTotal(pid);const min=Number(p.minStock)||0;if(tot<=0)return 'op';if(min>0&&tot<min)return 'laag';return null}
  function expiryWarning(e,frozen){if(!e||!e.date)return 'Geen vervaldatum ingevuld — vul de datum in of ken zelf een gebruiksdatum toe.';

      if(e.type==='OPEN')return 'Houdbaarheid na opening verstreken — controleer zorgvuldig voor gebruik.';return 'Zelf gekozen gebruiksdatum verstreken — controleer de kwaliteit.'}

  function hist(action,lot,qty,extra){extra=extra||{};const p=lot&&S.products[lot.productId];
    const h={id:uid('h'),ts:nowISO(),date:todayStr(),action,productId:lot?lot.productId:(extra.productId||''),lotId:lot?lot.id:'',name:extra.name||(p?p.name:''),qty:qty==null?'':rnd(qty),unit:lot?lot.unit:(extra.unit||''),from:extra.from||'',to:extra.to||(lot?lot.locationId:''),user,note:extra.note||''};
    put('history',h);const ids=Object.keys(S.history);if(ids.length>6000){Object.values(S.history).sort((a,b)=>a.ts<b.ts?-1:1).slice(0,ids.length-6000).forEach(x=>del('history',x.id))}return h}
  function findProductByBarcode(code){if(!code)return null;code=String(code).trim();return Object.values(S.products).find(p=>p.barcode===code)||Object.values(S.products).find(p=>Array.isArray(p.barcodes)&&p.barcodes.includes(code))||null}
  function findProductByName(name,brand){const n=norm(name),b=norm(brand);if(!n)return null;const c=Object.values(S.products).filter(p=>norm(p.name)===n);return c.find(p=>norm(p.brand)===b)||c[0]||null}
  function saveProduct(data){const isNew=!data.id||!S.products[data.id];
    const p=Object.assign({unit:'stuks',minStock:0,reorderWhenEmpty:true,createdAt:nowISO()},isNew?{}:S.products[data.id],data);
    if(!p.id)p.id=uid('p');p.name=String(p.name||'').trim();if(!p.name)throw new Error('Productnaam is verplicht.');
    p.minStock=Number(p.minStock)||0;p.packSize=Number(p.packSize)||0;p.openShelfDays=Number(p.openShelfDays)||0;p.updatedAt=nowISO();
    tx(()=>{put('products',p);if(!isNew){hist('aangepast',null,null,{productId:p.id,name:p.name,note:'Productgegevens bijgewerkt'});checkMinStock(p.id)}});return p}
  function deleteProduct(pid){tx(()=>{lotsOf(pid).forEach(l=>del('lots',l.id));Object.values(S.lots).filter(l=>l.productId===pid).forEach(l=>del('lots',l.id));const p=S.products[pid];hist('verwijderd',null,null,{productId:pid,name:p?p.name:'',note:'Product en alle partijen verwijderd'});Object.values(S.shopping).filter(s=>s.productId===pid).forEach(s=>put('shopping',Object.assign({},s,{productId:''})));del('products',pid)})}
  function addLot(d,opts){opts=opts||{};if(!S.products[d.productId])throw new Error('Product ontbreekt.');if(!S.locations[d.locationId])throw new Error('Kies een opslaglocatie.');
    const q=Number(d.qty);if(!(q>0))throw new Error('Hoeveelheid moet groter zijn dan 0.');const P0=S.products[d.productId];const lu=d.unit||P0.unit;if(convert(1,lu,P0.unit,P0)==null)throw new Error(unitErr(lu,P0));
    const lot={id:uid('lot'),productId:d.productId,locationId:d.locationId,qty:rnd(q),initialQty:rnd(q),unit:d.unit||S.products[d.productId].unit,purchaseDate:d.purchaseDate||todayStr(),
      dateType:d.expiryDate?(d.dateType&&d.dateType!=='GEEN'?d.dateType:'THT'):'',expiryDate:d.expiryDate||'',freezeDate:d.freezeDate||'',opened:!!d.opened,openedDate:d.opened?(d.openedDate||todayStr()):'',
      batch:d.batch||'',notes:d.notes||'',needsCheck:!!d.needsCheck,source:d.source||'manueel',createdAt:nowISO(),by:user,lastChecked:''};
    return tx(()=>{put('lots',lot);hist(opts.action||'toegevoegd',lot,lot.qty,{note:opts.note||(lot.source!=='manueel'?'via '+lot.source:'')});
      const p=S.products[d.productId];put('products',Object.assign({},p,{lastLocationId:d.locationId,lastQty:lot.qty,lastUnit:lot.unit}));afterStockChange(d.productId);return lot})}
  function updateLot(id,patch,note){const lot=S.lots[id];if(!lot)throw new Error('Partij niet gevonden.');const n=Object.assign({},lot,patch,{updatedAt:nowISO()});if(patch.qty!=null)n.qty=rnd(Number(patch.qty));const P1=S.products[lot.productId];if(P1&&convert(1,n.unit,P1.unit,P1)==null)throw new Error(unitErr(n.unit,P1));
    if(!n.expiryDate)n.dateType='';else if(!n.dateType)n.dateType='THT';if(n.opened&&!n.openedDate)n.openedDate=todayStr();if(!n.opened)n.openedDate='';
    return tx(()=>{if(n.qty<=0){hist('opgebruikt',lot,lot.qty,{note:note||'Hoeveelheid op 0 gezet'});del('lots',id)}else{put('lots',n);hist('aangepast',n,n.qty,{note:note||'Partij bijgewerkt'})}afterStockChange(lot.productId);return n})}
  function consume(id,qty,opts){opts=opts||{};const lot=S.lots[id];if(!lot)throw new Error('Partij niet gevonden.');qty=Number(qty)||0;if(qty<=0)throw new Error('Geef een hoeveelheid groter dan 0 op.');

      else{put('lots',Object.assign({},lot,{qty:rest,updatedAt:nowISO()}));hist(action,lot,used,{note:opts.note||''})}afterStockChange(lot.productId);return {used,rest}})}
  function useUp(id,note){const lot=S.lots[id];if(!lot)throw new Error('Partij niet gevonden.');return consume(id,lot.qty,{action:'opgebruikt',note})}
  function discard(id,qty,note){const lot=S.lots[id];if(!lot)throw new Error('Partij niet gevonden.');return consume(id,qty==null?lot.qty:qty,{action:'weggegooid',note:note||''})}
  function topUpLot(id,qty){const lot=S.lots[id];if(!lot)throw new Error('Partij niet gevonden.');qty=Number(qty);if(!(qty>0))throw new Error('Geef een hoeveelheid op.');

  function moveLot(id,toLoc,qty,o){o=o||{};const lot=S.lots[id];if(!lot)throw new Error('Partij niet gevonden.');if(!S.locations[toLoc])throw new Error('Doellocatie bestaat niet.');if(toLoc===lot.locationId)throw new Error('Het product ligt al op deze locatie.');

      if(qty<lot.qty-0.0005){moved=Object.assign({},lot,extra,{id:uid('lot'),qty:rnd(qty),initialQty:rnd(qty),locationId:toLoc,splitFrom:lot.id,createdAt:lot.createdAt,updatedAt:nowISO()});put('lots',moved);put('lots',Object.assign({},lot,{qty:rnd(lot.qty-qty)}))}
      else{moved=Object.assign({},lot,extra,{locationId:toLoc,updatedAt:nowISO()});put('lots',moved)}
      hist('verplaatst',moved,moved.qty,{from:lot.locationId,to:toLoc,note:locName(lot.locationId)+' → '+locName(toLoc)+(moved.freezeDate?' · invriesdatum '+fmtDate(moved.freezeDate)+(o.freezeNow?' (nu ingevroren)':' behouden'):'')});

  function openLot(id){const lot=S.lots[id];if(!lot)throw new Error('Partij niet gevonden.');if(lot.opened)throw new Error('Deze partij is al geopend.');
    return tx(()=>{let o;if((lot.unit==='stuks'||lot.unit==='verpakkingen')&&lot.qty>1){o=Object.assign({},lot,{id:uid('lot'),qty:1,initialQty:1,opened:true,openedDate:todayStr(),splitFrom:lot.id});put('lots',o);put('lots',Object.assign({},lot,{qty:rnd(lot.qty-1)}))}

  function deleteLot(id){const lot=S.lots[id];if(!lot)return;tx(()=>{hist('verwijderd',lot,lot.qty,{note:'Registratie verwijderd'});del('lots',id);afterStockChange(lot.productId)})}
  function markChecked(locId){tx(()=>{lotsIn(locId).forEach(l=>{if(l.needsCheck)put('lots',Object.assign({},l,{needsCheck:false}))});hist('gecontroleerd',null,null,{name:locName(locId),note:'Voorraadcontrole uitgevoerd',to:locId});const lc=Object.assign({},state().locChecked||{});lc[locId]=todayStr();saveState({locChecked:lc})})}
  function allocateFIFO(pid,qty,unit,reserved){const p=S.products[pid];const res=[];let remaining=Number(qty)||0;

  function afterStockChange(pid){const p=S.products[pid];if(!p)return;const tot=productTotal(pid);

  const openShoppingFor=pid=>Object.values(S.shopping).find(s=>s.productId===pid)||null;

  function addShopping(d){const name=String(d.name||'').trim();if(!name)throw new Error('Geef een productnaam op.');

  function updateShopping(id,patch){const s=S.shopping[id];if(s)put('shopping',Object.assign({},s,patch))}

const Store={mode:'init',status:'connecting',synced:false,adapter:null,provider:null,ctx:null,error:''};
function sanitize(o){return JSON.parse(JSON.stringify(o))}
function makeYjsAdapter(collab){const Y=collab.Y;const doc=new Y.Doc();const provider=collab.connect(doc);const maps={};COLS.forEach(c=>maps[c]=doc.getMap(c));
  return {kind:'yjs',doc,provider,maps,put(c,o){maps[c].set(o.id,sanitize(o))},del(c,id){maps[c].delete(id)},transact(fn){doc.transact(fn,'local')},
    snapshot(){const d={};COLS.forEach(c=>{d[c]={};maps[c].forEach((v,k)=>{d[c][k]=v})});return d},
    observe(M){COLS.forEach(c=>maps[c].observe(ev=>{if(ev.transaction.origin==='local')return;ev.changes.keys.forEach((chg,key)=>{M.applyRemote(c,key,maps[c].has(key)?maps[c].get(key):null)})}))}}}
function makeLocalAdapter(){let ls=null;try{ls=window.localStorage;ls.setItem('__svb','1');ls.removeItem('__svb')}catch(e){ls=null}
  let idb=null;const dirty=new Set();let timer=null;let M=null;let lastErr='';
  function openIDB(){return new Promise((res)=>{try{if(!window.indexedDB)return res(null);const rq=indexedDB.open('slim-voorraadbeheer',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);rq.onblocked=()=>res(null)}catch(e){res(null)}})}
  function idbGetAll(){return new Promise((res)=>{try{const tx=idb.transaction('kv','readonly');const st=tx.objectStore('kv');const out={};const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>res(null)}catch(e){res(null)}})}
  function flush(){timer=null;if(!M)return;const cols=Array.from(dirty);dirty.clear();
    if(idb){try{const tx=idb.transaction('kv','readwrite');const st=tx.objectStore('kv');cols.forEach(c=>st.put(M.S[c],c));tx.onerror=()=>{lastErr='Opslaan in IndexedDB mislukt';writeLS(cols)};tx.oncomplete=()=>{Store.lastSave=new Date();updateSync()}}catch(e){writeLS(cols)}}
    else writeLS(cols)}
  function writeLS(cols){if(!ls){Store.error='Je browser blokkeert lokale opslag. Wijzigingen gaan verloren bij afsluiten — maak een back-up.';updateSync();return}
    try{cols.forEach(c=>ls.setItem('svb:'+c,JSON.stringify(M.S[c])));Store.lastSave=new Date();updateSync()}catch(e){Store.error='Opslagruimte vol: verwijder productfoto\'s of maak een back-up.';toast(Store.error,'error')}}
  return {kind:'local',get available(){return !!(idb||ls)},
    async init(model){M=model;idb=await openIDB();let data=null;if(idb)data=await idbGetAll();
      if((!data||!Object.keys(data).length)&&ls){data={};COLS.forEach(c=>{try{const v=ls.getItem('svb:'+c);if(v)data[c]=JSON.parse(v)}catch(e){}})}
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>{Store.persisted=p}).catch(()=>{});
      return data||{}},
    put(c){dirty.add(c);if(!timer)timer=setTimeout(flush,250)},del(c){dirty.add(c);if(!timer)timer=setTimeout(flush,250)},flushNow(){if(timer){clearTimeout(timer);flush()}},
    get backend(){return idb?'IndexedDB (browser)':ls?'localStorage (browser)':'geen (tijdelijk geheugen)'}}}

function toast(msg,kind,action){const box=$('#toasts');if(!box)return;const el=document.createElement('div');el.className='toast'+(kind==='error'?' error':'');el.setAttribute('role',kind==='error'?'alert':'status');
  el.innerHTML='<span class="grow">'+esc(msg)+'</span>'+(action?'<button type="button">'+esc(action.label)+'</button>':'');box.appendChild(el);
  if(action)el.querySelector('button').onclick=()=>{el.remove();action.fn()};setTimeout(()=>el.remove(),kind==='error'?7000:action?6500:3200)}
const Modals=[];
function openModal(m){Modals.push(m);paintModal();return m}
function closeModal(){const m=Modals.pop();if(m&&m.onClose)try{m.onClose()}catch(e){}paintModal()}
function closeAllModals(){while(Modals.length)closeModal()}
function replaceModal(m){Modals.pop();Modals.push(m);paintModal()}
function paintModal(){const root=$('#modal-root');if(!Modals.length){root.innerHTML='';root._m=null;document.body.style.overflow='';return}const m=Modals[Modals.length-1];
  const same=root._m===m;const ov0=same?root.querySelector('.overlay'):null;const st=ov0?ov0.scrollTop:0;const mb0=ov0?ov0.querySelector('.m-body'):null;const st2=mb0?mb0.scrollTop:0;const fid=same&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#modal-root')?(document.activeElement.getAttribute('name')||document.activeElement.id||''):'';root._m=m;
  const body=typeof m.body==='function'?m.body():m.body;const foot=typeof m.foot==='function'?m.foot():m.foot;
  root.innerHTML='<div class="overlay'+(same?' no-anim':'')+'" data-act="overlay"><div class="modal'+(m.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="m-title" data-glean-id="'+esc(m.gid||'dialog')+'"><div class="m-head"><h3 id="m-title">'+esc(m.title)+'</h3><button type="button" class="icon-btn" data-act="closeModal" aria-label="Sluiten">'+ico('close','✕')+'</button></div><div class="m-body">'+body+'</div>'+(foot?'<div class="m-foot">'+foot+'</div>':'')+'</div></div>';
  document.body.style.overflow='hidden';if(m.mount)try{m.mount($('.modal',root))}catch(e){console.error(e)}
  if(same){const ov=root.querySelector('.overlay');if(ov)ov.scrollTop=st;const mb=ov&&ov.querySelector('.m-body');if(mb)mb.scrollTop=st2;if(fid){const el=root.querySelector('[name="'+fid+'"]')||root.querySelector('#'+fid);if(el&&el.focus)try{el.focus({preventScroll:true})}catch(e){}}return}
  const first=$('.modal [autofocus]',root);if(first)setTimeout(()=>first.focus({preventScroll:true}),30)}
function refreshLiveModal(){const m=Modals[Modals.length-1];if(m&&m.live){const sc=$('.overlay')?$('.overlay').scrollTop:0;paintModal();if($('.overlay'))$('.overlay').scrollTop=sc}}
function confirmBox(title,text,okLabel,fn,danger){openModal({title,gid:'dialog-confirm',body:'<p style="margin:0">'+esc(text)+'</p>',foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn '+(danger?'danger':'primary')+'" data-act="confirmOk">'+esc(okLabel||'Bevestigen')+'</button>',onOk:fn})}
function formData(root){const o={};$$('[name]',root).forEach(el=>{if(el.type==='checkbox')o[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)o[el.name]=el.value}else o[el.name]=el.value.trim()});return o}
function download(name,data,mime){const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[data-src="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.async=true;s.dataset.src=src;s.onload=()=>res();s.onerror=()=>{s.remove();rej(new Error('Kon '+src.split('/')[2]+' niet laden'))};document.head.appendChild(s)})}
function resizeImage(file,max,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res({dataUrl:c.toDataURL('image/jpeg',q||0.72),canvas:c,img})};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Afbeelding kon niet gelezen worden.'))};img.src=url})}

function parseHash(){const h=(location.hash||'').replace(/^#\/?/,'');const [v,qs]=h.split('?');const params={};if(qs)qs.split('&').forEach(kv=>{const [k,val]=kv.split('=');if(k)params[decodeURIComponent(k)]=decodeURIComponent(val||'')});return {view:VIEWS.some(x=>x[0]===v)?v:'dashboard',params}}
function go(view,params){const qs=params&&Object.keys(params).length?'?'+Object.entries(params).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):'';const target='#/'+view+qs;
  if(location.hash===target){applyRoute();return}try{location.hash=target}catch(e){UI.view=view;UI.params=params||{};render(true)}}

const A={};
A.closeModal=()=>closeModal();
A.overlay=(d,el,e)=>{if(e.target===el)closeModal()};
A.confirmOk=()=>{const m=Modals[Modals.length-1];closeModal();if(m&&m.onOk)m.onOk()};
A.go=d=>{const p={};Object.keys(d).forEach(k=>{if(k.startsWith('p')&&k.length>1&&k!=='prevent'){p[k.slice(1).toLowerCase()]=d[k]}});go(d.view,p)};
function runAct(fn,d,el,e){try{const r=fn(d,el,e);if(r&&r.catch)r.catch(err=>{console.error(err);toast(err.message||String(err),'error')})}catch(err){console.error(err);toast(err.message||String(err),'error')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.act==='overlay'&&e.target!==el)return;const fn=A[el.dataset.act];if(!fn)return;if(el.tagName!=='INPUT')e.preventDefault();runAct(fn,el.dataset,el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const fn=A[el.dataset.change];if(fn)runAct(fn,el.dataset,el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(!el)return;const fn=A[el.dataset.input];if(fn)runAct(fn,el.dataset,el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&Modals.length){closeModal();return}
  if(e.key==='Enter'&&e.target.matches('[data-enter]')){e.preventDefault();const fn=A[e.target.dataset.enter];if(fn)runAct(fn,e.target.dataset,e.target,e)}});

function usageTip(x,recMap){const p=x.p,e=x.e,l=x.l;
  if(e.level==='expired'&&e.type==='TGT')return {txt:'Niet meer gebruiken — weggooien.',tgt:true};
  if(e.level==='expired')return {txt:'Eerst controleren (geur, kleur, smaak) en dan snel verwerken.'};
  const r=recMap[l.id];if(r)return {txt:'Maak: '+r.name,rid:r.id};
  const frozen=M.isFreezer(l.locationId);const s=p.sub||'',c=p.category||'';
  if(!frozen&&(c==='Vlees, vis en gevogelte'))return {txt:e.days<=1?'Vandaag bereiden of meteen invriezen.':'Binnen enkele dagen bereiden of invriezen.',freeze:true};
  if(s==='Brood en beschuiten')return {txt:'Invriezen of verwerken in wentelteefjes / croque.',freeze:!frozen};
  if(s==='Vers fruit')return {txt:'Smoothie, havermout of bananenbrood.'};
  if(s==='Verse groenten')return {txt:'Soep, roerbak of frittata.'};
  if(c==='Koeling')return {txt:s==='Kaas'?'Croque, gratin of pasta.':'Ontbijt, saus of dessert.'};
  if(frozen)return {txt:'Ontdooien in de koelkast en deze week gebruiken.'};
  return {txt:'Plan het in je weekmenu.'}}

const STATUS_FILTERS=[['','Alles'],['bijna','Bijna vervallen'],['vervallen','Vervallen'],['laag','Bijna op'],['geopend','Geopend'],['geendatum','Geen datum'],['controle','Te controleren']];
VIEW_RENDER.voorraad=function(){const f=UI.inv;if(UI.params.status!=null&&UI.params.status!==f._lastParam){f.status=UI.params.status;f._lastParam=UI.params.status}
  const cats=M.categories();let h='<div class="toolbar"><input id="inv-q" class="inp" style="max-width:280px" placeholder="Zoek product, merk, barcode…" value="'+esc(f.q)+'" data-input="invFilter" data-k="q">'+
   '<select class="inp" style="max-width:220px" data-change="invFilter" data-k="loc"><option value="">Alle opslagplaatsen</option>'+sel(f.loc,M.locations().map(l=>[l.id,l.name]))+'</select>'+
   '<select class="inp" style="max-width:200px" data-change="invFilter" data-k="cat"><option value="">Alle categorieën</option>'+sel(f.cat,cats.map(c=>c.name))+'</select>'+
   '<select class="inp" style="max-width:170px" data-change="invFilter" data-k="sort">'+sel(f.sort,[['naam','Sorteer: naam'],['vervaldatum','Sorteer: vervaldatum'],['locatie','Sorteer: locatie'],['hoeveelheid','Sorteer: weinig voorraad']])+'</select>'+
   '<span class="grow"></span><button type="button" class="btn" data-act="exportInv">⬇ Excel</button><button type="button" class="btn" data-act="go" data-view="scanner" data-pmode="uit">📤 Lege verpakking</button><button type="button" class="btn primary" data-act="scanMode" data-mode="manueel">+ Product</button></div>';
  h+='<div class="row" style="margin:-4px 0 14px">'+STATUS_FILTERS.map(s=>'<button type="button" class="chip" aria-pressed="'+(f.status===s[0])+'" data-act="invStatus" data-s="'+s[0]+'">'+s[1]+'</button>').join('')+'<label class="check small" style="margin-left:6px"><input type="checkbox" '+(f.showEmpty?'checked':'')+' data-change="invFilter" data-k="showEmpty"> Ook lege producten</label></div>';
  const q=norm(f.q);let rows=M.products().map(p=>{let ls=M.fifoLots(p.id);const all=ls;if(f.loc)ls=ls.filter(l=>l.locationId===f.loc);return {p,ls,all,total:M.productTotal(p.id),level:M.productLevel(p.id)}});
  rows=rows.filter(r=>{const p=r.p;if(q&&!norm([p.name,p.brand,p.barcode,p.sub,p.category].join(' ')).includes(q))return false;if(f.cat&&p.category!==f.cat)return false;
    if(f.loc&&!r.ls.length)return false;if(!f.showEmpty&&!r.all.length&&f.status!=='laag')return false;
    const ex=r.ls.map(l=>M.lotExpiry(l));
    switch(f.status){case 'bijna':return ex.some(e=>['red','orange','yellow'].includes(e.level));case 'vervallen':return ex.some(e=>e.level==='expired');case 'laag':return !!r.level&&(r.level==='laag'||Number(p.minStock)>0||r.all.length===0);
      case 'geopend':return r.ls.some(l=>l.opened);case 'geendatum':return ex.some(e=>e.level==='none');case 'controle':return r.ls.some(l=>l.needsCheck)}return true});
  const firstExp=r=>{const d=r.ls.map(l=>M.lotExpiry(l).date).filter(Boolean).sort()[0];return d||'9999'};
  if(f.sort==='vervaldatum')rows.sort((a,b)=>firstExp(a)<firstExp(b)?-1:1);else if(f.sort==='locatie')rows.sort((a,b)=>M.locName(a.ls[0]&&a.ls[0].locationId).localeCompare(M.locName(b.ls[0]&&b.ls[0].locationId)));else if(f.sort==='hoeveelheid')rows.sort((a,b)=>((a.total/(a.p.minStock||1e9))-(b.total/(b.p.minStock||1e9))));
  h+='<div class="small muted" style="margin-bottom:8px">'+plural(rows.length,'product','producten')+'</div>';
  if(!rows.length)return h+'<div class="card empty">Geen producten gevonden. '+(M.products().length?'Pas de filters aan.':'Begin met scannen of voeg manueel een product toe.')+'</div>';
  rows.forEach(r=>h+=productCard(r));return h};
function productCard(r){const p=r.p;const first=r.ls[0];const e=first?M.lotExpiry(first):null;
  let h='<div class="prod" data-glean-id="prod-'+esc(p.id)+'">'+thumb(p)+'<div class="info"><div class="row nowrap between"><div style="min-width:0"><div class="name" data-act="product" data-id="'+esc(p.id)+'">'+esc(p.name)+(p.brand?' <span class="muted" style="font-weight:400">· '+esc(p.brand)+'</span>':'')+scoreChip(p)+'</div><div class="small muted">'+esc([p.category,p.sub].filter(Boolean).join(' › '))+'</div></div><div style="text-align:right"><div class="qty">'+esc(fmtQty(r.total,p.unit))+'</div>'+
    (r.level==='op'?'<span class="tag lv-expired">op</span>':r.level==='laag'?'<span class="tag lv-yellow">onder min. '+esc(fmtQty(p.minStock,p.unit))+'</span>':p.minStock?'<span class="small muted">min. '+esc(fmtQty(p.minStock,p.unit))+'</span>':'')+'</div></div>';
  if(r.ls.length){h+='<div class="lots">';r.ls.forEach((l,i)=>{const le=M.lotExpiry(l);h+='<span class="lotchip" data-act="product" data-id="'+esc(p.id)+'" title="Partij '+(i+1)+'">'+(i===0&&r.ls.length>1?'① ':'')+'<b>'+esc(fmtQty(l.qty,l.unit))+'</b> · '+esc(M.locName(l.locationId))+(l.opened?' · geopend':'')+(l.freezeDate?' · ❄ '+fmtDate(l.freezeDate):'')+' · <span class="tag lv-'+le.level+'" style="padding:0 5px">'+(le.date?esc((TYPE_SHORT[le.type]||'')+' '+fmtDate(le.date)):'geen datum')+'</span>'+(l.needsCheck?' · ❓':'')+'</span>'});h+='</div>'}
  h+='</div><div class="qbtns">'+(first?'<button type="button" class="round" title="Gebruiken (FIFO)" aria-label="Gebruiken" data-act="useProduct" data-id="'+esc(p.id)+'">−</button>':'')+'<button type="button" class="round" title="Aanvullen / nieuwe partij" aria-label="Aanvullen" data-act="addLotFor" data-id="'+esc(p.id)+'">+</button></div></div>';return h}

     '<div class="sub-t">'+(e.date?typeTag(e)+' '+fmtDate(e.date)+' · '+esc(daysLabel(e)):'<span class="tag lv-none">geen datum</span>')+(l.freezeDate?' · ❄ ingevroren '+fmtDate(l.freezeDate):'')+(l.opened?' · geopend '+fmtDate(l.openedDate):' · ongeopend')+' · gekocht '+fmtDate(l.purchaseDate)+(l.batch?' · lot '+esc(l.batch):'')+(l.needsCheck?' · <span class="tag lv-info">te controleren</span>':'')+'</div>'+
     (w&&(e.level==='expired'||e.level==='none')?'<div class="warn-txt'+(!ok?' tgt':'')+'">⚠ '+esc(w)+'</div>':'')+(l.notes?'<div class="small">'+esc(l.notes)+'</div>':'')+'</div><div class="acts">'+
     (ok?'<button type="button" class="btn sm" data-act="useLot" data-id="'+esc(l.id)+'">− Gebruik</button><button type="button" class="btn sm" data-act="useUpLot" data-id="'+esc(l.id)+'">✓ Op</button>':'')+'<button type="button" class="btn sm" data-act="topUpLot" data-id="'+esc(l.id)+'">+</button>'+(!l.opened?'<button type="button" class="btn sm" data-act="openLot" data-id="'+esc(l.id)+'">Openen</button>':'')+

A.discardOk=d=>{const r=$('#disc-r').value;const l=M.S.lots[d.id];const p=M.S.products[l.productId];closeModal();withUndo(p.name+' weggegooid.',()=>M.discard(d.id,null,r))};
A.deleteLot=d=>{const l=M.S.lots[d.id];if(!l)return;const p=M.S.products[l.productId];closeModal();withUndo('Registratie van '+p.name+' verwijderd.',()=>M.deleteLot(d.id))};
A.openLot=d=>{const l=M.S.lots[d.id];const p=M.S.products[l.productId];const o=M.openLot(d.id);toast(p.name+' geopend'+(o.id!==d.id?' (1 '+(l.unit==='stuks'?'stuk':'verpakking')+' apart gezet)':'')+'.'+(p.openShelfDays?' Houdbaar tot '+fmtDate(addDays(todayStr(),p.openShelfDays))+'.':''))};
A.topUpLot=d=>{const l=M.S.lots[d.id];if(!l)return;openModal({title:'Partij aanvullen',gid:'dialog-topup',body:lotHead(l)+'<div class="field"><label for="tu-q">Toe te voegen hoeveelheid ('+esc(l.unit)+')</label><input id="tu-q" class="inp" type="number" min="0" step="any" autofocus data-enter="topUpOk" data-id="'+esc(l.id)+'"></div><div class="note">Tip: voor een nieuwe aankoop met een andere vervaldatum maak je beter een <a href="#" data-act="addLotFor" data-id="'+esc(l.productId)+'">nieuwe partij</a> aan, zodat FIFO correct blijft.</div>',foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="topUpOk" data-id="'+esc(l.id)+'">Aanvullen</button>'})};
A.topUpOk=d=>{const q=Number($('#tu-q').value);const l=M.topUpLot(d.id,q);closeModal();toast('Aangevuld: nu '+fmtQty(l.qty,l.unit)+'.')};
function freezeSuggest(p,from){const fm=M.settings().freezeMonths;const months=fm[p.sub]||fm[p.category]||fm._default||6;return addMonths(from||todayStr(),months)}
A.moveLot=d=>moveDialog(d.id,false);A.freezeLot=d=>moveDialog(d.id,true);
function moveDialog(id,freeze){const l=M.S.lots[id];if(!l)return;const p=M.S.products[l.productId];const others=M.locations().filter(x=>x.id!==l.locationId);let target=freeze?(others.find(x=>x.type==='diepvries')||others[0]).id:others[0].id;
  openModal({title:freeze?'Invriezen':'Product verplaatsen',gid:'dialog-move',body:lotHead(l)+'<div class="grid2"><div class="field"><label>Naar</label><select id="mv-to" class="inp" data-change="mvTo">'+sel(target,others.map(x=>[x.id,x.name]))+'</select></div><div class="field"><label>Hoeveelheid ('+esc(l.unit)+')</label><input id="mv-q" class="inp" type="number" step="any" min="0" max="'+l.qty+'" value="'+l.qty+'"></div></div>'+
   '<div id="mv-freeze"></div><div class="hint">Invriesdatum, aankoopdatum en vervaldatum blijven behouden. Een deel verplaatsen maakt een aparte partij.</div>',
   foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="moveOk" data-id="'+esc(id)+'">Verplaatsen</button>',mount:()=>mvFreezeBox(l,p,freeze)})}
function mvFreezeBox(l,p,force){const to=$('#mv-to').value;const box=$('#mv-freeze');if(!box)return;if(M.isFreezer(to)&&!l.freezeDate){const sug=freezeSuggest(p);box.innerHTML='<div class="note"><label class="check"><input type="checkbox" id="mv-fn" checked> Nu invriezen (invriesdatum vandaag)</label><div class="grid2" style="margin-top:8px"><div class="field"><label>Nieuwe gebruiksdatum (eigen)</label><input id="mv-exp" type="date" class="inp" value="'+sug+'"></div><div class="hint" style="align-self:end">Voorstel: '+fmtDate(sug)+' op basis van '+esc(p.sub||p.category||'standaard')+'. Laat leeg om de huidige datum te houden.</div></div></div>'}else if(M.isFreezer(to)&&l.freezeDate){box.innerHTML='<div class="note">❄ Oorspronkelijke invriesdatum '+fmtDate(l.freezeDate)+' blijft behouden.</div>'}else box.innerHTML=''}
A.mvTo=()=>{const m=Modals[Modals.length-1];const id=$('[data-act="moveOk"]').dataset.id;const l=M.S.lots[id];mvFreezeBox(l,M.S.products[l.productId])};
A.moveOk=d=>{const to=$('#mv-to').value;const q=$('#mv-q').value;const fn=$('#mv-fn');const l=M.S.lots[d.id];const p=M.S.products[l.productId];const o=fn&&fn.checked?{freezeNow:true,newExpiry:($('#mv-exp')||{}).value||''}:{};closeModal();withUndo(p.name+' verplaatst naar '+M.locName(to)+'.',()=>M.moveLot(d.id,to,q,o))};
A.editLot=d=>{const l=M.S.lots[d.id];if(!l)return;const p=M.S.products[l.productId];
  openModal({title:'Partij bewerken',gid:'dialog-edit-lot',body:'<div style="font-weight:600">'+esc(p.name)+'</div>'+lotFields(l,p),foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="editLotOk" data-id="'+esc(l.id)+'">Opslaan</button>'})};
function lotFields(l,p){l=l||{};const dt=l.expiryDate?(l.dateType||'THT'):(l.id?'GEEN':(l.dateType||'THT'));
  return '<div class="grid3"><div class="field"><label>Hoeveelheid</label><input name="qty" class="inp" type="number" step="any" min="0" value="'+esc(l.qty==null?'':l.qty)+'"></div><div class="field"><label>Eenheid</label><select name="unit" class="inp">'+sel(l.unit||p.unit||'stuks',UNITS.map(u=>[u.id,u.label]))+'</select></div><div class="field"><label>Opslaglocatie</label><select name="locationId" class="inp">'+sel(l.locationId||'',M.locations().map(x=>[x.id,x.name]))+'</select></div>'+
   '<div class="field"><label>Datumtype</label><select name="dateType" class="inp">'+sel(dt,DATE_TYPES)+'</select></div><div class="field"><label>Vervaldatum / gebruiksdatum</label><input name="expiryDate" type="date" class="inp" value="'+esc(l.expiryDate||'')+'"></div><div class="field"><label>Aankoopdatum</label><input name="purchaseDate" type="date" class="inp" value="'+esc(l.purchaseDate||todayStr())+'"></div>'+
   '<div class="field"><label>Invriesdatum</label><input name="freezeDate" type="date" class="inp" value="'+esc(l.freezeDate||'')+'"></div><div class="field"><label>Batch / lot</label><input name="batch" class="inp" value="'+esc(l.batch||'')+'"></div><div class="field"><label>Geopend op</label><input name="openedDate" type="date" class="inp" value="'+esc(l.openedDate||'')+'"></div></div>'+
   '<div class="row"><label class="check"><input type="checkbox" name="opened" '+(l.opened?'checked':'')+'> Geopend</label><label class="check"><input type="checkbox" name="needsCheck" '+(l.needsCheck?'checked':'')+'> Nog te controleren</label></div><div class="field"><label>Opmerking bij deze partij</label><input name="notes" class="inp" value="'+esc(l.notes||'')+'"></div>'}
function readLot(root){const f=formData(root);if(f.dateType==='GEEN')f.expiryDate='';if(f.expiryDate&&f.dateType==='GEEN')f.dateType='EIGEN';return f}
A.editLotOk=d=>{const f=readLot($('.modal'));const l=M.S.lots[d.id];const patch={qty:Number(f.qty),unit:f.unit,dateType:f.expiryDate?f.dateType:'',expiryDate:f.expiryDate,purchaseDate:f.purchaseDate,freezeDate:f.freezeDate,batch:f.batch,opened:f.opened,openedDate:f.opened?(f.openedDate||todayStr()):'',needsCheck:f.needsCheck,notes:f.notes};
  if(!(patch.qty>=0))throw new Error('Ongeldige hoeveelheid.');const moving=f.locationId&&f.locationId!==l.locationId;M.tx(()=>{M.updateLot(d.id,patch);if(moving&&M.S.lots[d.id])M.moveLot(d.id,f.locationId)});closeModal();toast('Partij bijgewerkt.')};
A.useProduct=d=>{const p=M.S.products[d.id];const ls=M.fifoLots(d.id).filter(l=>M.suitable(l));if(!ls.length)throw new Error('Geen bruikbare voorraad (TGT-overschreden partijen worden overgeslagen).');
  openModal({title:'Gebruiken: '+p.name,gid:'dialog-use-product',body:'<div class="grid2"><div class="field"><label for="up-q">Hoeveelheid</label><input id="up-q" class="inp" type="number" step="any" min="0" autofocus data-input="upPreview" data-id="'+esc(p.id)+'"></div><div class="field"><label>Eenheid</label><select id="up-u" class="inp" data-change="upPreview" data-id="'+esc(p.id)+'">'+sel(p.unit,UNITS.filter(u=>convert(1,u.id,p.unit,p)!=null).map(u=>[u.id,u.label]))+'</select></div></div>'+
   '<div class="field"><label>Uit welke partij?</label><select id="up-lot" class="inp" data-change="upPreview" data-id="'+esc(p.id)+'"><option value="">Automatisch – oudste / eerst vervallend eerst (FIFO)</option>'+sel('',ls.map(l=>{const e=M.lotExpiry(l);return [l.id,fmtQty(l.qty,l.unit)+' · '+M.locName(l.locationId)+' · '+(e.date?(TYPE_SHORT[e.type]+' '+fmtDate(e.date)):'geen datum')]}))+'</select></div><div id="up-prev" class="note">Geef een hoeveelheid in om de verdeling te zien.</div>',
   foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="useProductOk" data-id="'+esc(p.id)+'">Afboeken</button>'})};
function upPlan(pid){const q=Number($('#up-q').value),u=$('#up-u').value,lot=$('#up-lot').value;const p=M.S.products[pid];if(!(q>0))return null;
  if(lot){const l=M.S.lots[lot];const f=convert(1,l.unit,u,p);if(f==null)return {err:'Deze eenheid past niet bij de gekozen partij.'};return {allocs:[{lotId:lot,qty:rnd(Math.min(l.qty,q/f)),unit:l.unit}],shortfall:Math.max(0,rnd(q-l.qty*f))}}return M.allocateFIFO(pid,q,u)}
A.upPreview=d=>{const pl=upPlan(d.id);const box=$('#up-prev');if(!pl){box.textContent='Geef een hoeveelheid in om de verdeling te zien.';return}if(pl.err){box.textContent=pl.err;return}
  box.innerHTML='<b>Wordt afgeboekt:</b><br>'+pl.allocs.map(a=>{const l=M.S.lots[a.lotId];return '• '+esc(fmtQty(a.qty,a.unit))+' uit '+esc(M.locName(l.locationId))+' ('+esc(fmtQty(l.qty,l.unit))+' → '+esc(fmtQty(rnd(l.qty-a.qty),l.unit))+')'}).join('<br>')+(pl.shortfall>0?'<br><span class="st-miss">Te weinig voorraad: '+esc(fmtNum(pl.shortfall))+' '+esc($('#up-u').value)+' ontbreekt.</span>':'')};
A.useProductOk=d=>{const pl=upPlan(d.id);if(!pl||pl.err)throw new Error(pl?pl.err:'Geef een hoeveelheid in.');const p=M.S.products[d.id];closeModal();withUndo(p.name+': afgeboekt uit '+plural(pl.allocs.length,'partij','partijen')+'.',()=>M.tx(()=>pl.allocs.forEach(a=>M.consume(a.lotId,a.qty))))};
A.deleteProduct=d=>{const p=M.S.products[d.id];confirmBox('Product verwijderen','"'+p.name+'" en alle '+M.lotsOf(d.id).length+' partij(en) worden verwijderd. De geschiedenis blijft bewaard.','Verwijderen',()=>{closeAllModals();withUndo(p.name+' verwijderd.',()=>M.deleteProduct(d.id))},true)};
A.toShop=d=>{const p=M.S.products[d.id];const ex=M.openShoppingFor(d.id);if(ex){toast(p.name+' staat al op je lijst.');return}const q=p.minStock?Math.max(1,Math.ceil(p.minStock-M.productTotal(p.id))):(p.lastQty||1);M.addShopping({productId:p.id,name:p.name,qty:p.minStock?q:(p.lastQty||1),unit:p.minStock?p.unit:(p.lastUnit||p.unit),pack:p.packSize?fmtQty(p.packSize,p.packUnit):''});toast(p.name+' toegevoegd aan je boodschappenlijst.')};

/* ---------- OPSLAGPLAATSEN ---------- */
VIEW_RENDER.opslag=function(){const id=UI.params.id;if(id&&M.S.locations[id])return locationDetail(id);
  let h='<div class="toolbar"><div class="grow muted small">Klik op een opslagplaats om de inhoud te bekijken.</div><button type="button" class="btn primary" data-act="editLocation">+ Opslagplaats toevoegen</button></div>'+locTiles(true);
  h+='<div class="card" style="margin-top:18px" data-glean-id="loc-beheer"><h2 class="panel-title">Beheer</h2><div class="tablewrap"><table class="t"><thead><tr><th>Naam</th><th>Type</th><th>Producten</th><th>Bijna op</th><th>Bijna vervallen</th><th>Vervallen</th><th></th></tr></thead><tbody>';
  const ls=M.locations();ls.forEach((l,i)=>{const s=M.locStats(l.id);h+='<tr data-glean-id="locrow-'+esc(l.id)+'"><td>'+esc(l.icon||'')+' '+esc(l.name)+'</td><td>'+esc((LOCATION_TYPES.find(t=>t[0]===l.type)||['',''])[1])+'</td><td>'+s.products+'</td><td>'+s.low+'</td><td>'+s.soon+'</td><td>'+s.expired+'</td><td style="white-space:nowrap"><button type="button" class="btn sm ghost" data-act="locOrder" data-id="'+esc(l.id)+'" data-dir="-1" '+(i===0?'disabled':'')+' aria-label="Omhoog">↑</button><button type="button" class="btn sm ghost" data-act="locOrder" data-id="'+esc(l.id)+'" data-dir="1" '+(i===ls.length-1?'disabled':'')+' aria-label="Omlaag">↓</button><button type="button" class="btn sm" data-act="editLocation" data-id="'+esc(l.id)+'">Hernoemen</button><button type="button" class="btn sm danger" data-act="deleteLocation" data-id="'+esc(l.id)+'">Verwijderen</button></td></tr>'});
  return h+'</tbody></table></div></div>'};
function locationDetail(id){const l=M.S.locations[id];const s=M.locStats(id);const lc=(M.state().locChecked||{})[id];
  let h='<div class="toolbar"><button type="button" class="btn ghost" data-act="go" data-view="opslag">← Alle opslagplaatsen</button><span class="grow"></span><button type="button" class="btn" data-act="markChecked" data-id="'+esc(id)+'">✓ Voorraadcontrole afgerond</button><button type="button" class="btn" data-act="editLocation" data-id="'+esc(id)+'">Hernoemen</button><button type="button" class="btn primary" data-act="scanTo" data-loc="'+esc(id)+'">📷 Scan naar deze plek</button></div>';
  h+='<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+[['products',s.products,'Verschillende producten'],['total',esc(s.totalLabel),'Totale voorraad'],['low',s.low,'Bijna op'],['soon',s.soon,'Naderende vervaldatum'],['expired',s.expired,'Vervallen']].map(x=>'<div class="stat'+((x[0]==='expired'||x[0]==='low'||x[0]==='soon')&&x[1]>0?' alert':'')+'" data-glean-id="lockpi-'+x[0]+'"><div class="v" style="'+(x[0]==='total'?'font-size:18px;font-weight:500':'')+'">'+x[1]+'</div><div class="l">'+x[2]+'</div></div>').join('')+'</div>';
  h+='<div class="small muted" style="margin:-8px 0 12px">'+(lc?'Laatst gecontroleerd op '+fmtDate(lc):'Nog niet gecontroleerd')+'</div>';
  const lots=M.lotsIn(id).sort((a,b)=>M.fifoCmp(a,b));if(!lots.length)return h+'<div class="card empty">Deze opslagplaats is leeg.</div>';
  h+='<div class="card" data-glean-id="loc-inhoud"><div class="list">';lots.forEach(lot=>{const p=M.S.products[lot.productId];if(!p)return;const e=M.lotExpiry(lot);
    h+='<div class="li bar-'+e.level+'" data-glean-id="loclot-'+esc(lot.id)+'">'+thumb(p)+'<div class="grow" style="min-width:0"><div class="main-t" style="cursor:pointer" data-act="product" data-id="'+esc(p.id)+'">'+esc(p.name)+'</div><div class="sub-t">'+esc(fmtQty(lot.qty,lot.unit))+(lot.opened?' · geopend':'')+(lot.freezeDate?' · ❄ '+fmtDate(lot.freezeDate):'')+' · '+(e.date?typeTag(e)+' '+fmtDate(e.date):'geen datum')+'</div></div>'+daysBadge(e)+'<div class="acts"><button type="button" class="btn sm" data-act="useLot" data-id="'+esc(lot.id)+'">−</button><button type="button" class="btn sm" data-act="moveLot" data-id="'+esc(lot.id)+'">⇄</button></div></div>'});
  return h+'</div></div>'}
A.markChecked=d=>{M.markChecked(d.id);toast('Controle van '+M.locName(d.id)+' geregistreerd.')};
A.locOrder=d=>{const ls=M.locations();const i=ls.findIndex(x=>x.id===d.id);const j=i+Number(d.dir);if(j<0||j>=ls.length)return;M.tx(()=>{ls.forEach((l,k)=>{const o=k===i?j:k===j?i:k;if(l.order!==o+1)M.put('locations',Object.assign({},l,{order:o+1}))})})};
A.editLocation=d=>{const l=d.id?M.S.locations[d.id]:{};openModal({title:d.id?'Opslagplaats bewerken':'Nieuwe opslagplaats',gid:'dialog-location',body:'<div class="grid2"><div class="field span2"><label>Naam</label><input name="name" class="inp" value="'+esc(l.name||'')+'" autofocus placeholder="bv. Lade onder oven"></div><div class="field"><label>Type</label><select name="type" class="inp">'+sel(l.type||'kast',LOCATION_TYPES)+'</select></div><div class="field"><label>Pictogram</label><input name="icon" class="inp" value="'+esc(l.icon||'📦')+'" maxlength="4"></div></div><div class="hint">Type "Diepvriezer" zorgt ervoor dat de app invriesdatums en gebruiksdatums voorstelt.</div>',
  foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="saveLocation" data-id="'+esc(d.id||'')+'">Opslaan</button>'})};
A.saveLocation=d=>{const f=formData($('.modal'));const l=M.saveLocation(Object.assign({},d.id?{id:d.id}:{},f));closeModal();toast('Opslagplaats "'+l.name+'" opgeslagen.')};
A.deleteLocation=d=>{const l=M.S.locations[d.id];const n=M.lotsIn(d.id).length;const others=M.locations().filter(x=>x.id!==d.id);if(!others.length)throw new Error('Je hebt minstens één opslagplaats nodig.');
  openModal({title:'Opslagplaats verwijderen',gid:'dialog-delete-location',body:'<p style="margin:0">"'+esc(l.name)+'" verwijderen?</p>'+(n?'<div class="field"><label>Verplaats de '+n+' partij(en) naar</label><select id="dl-to" class="inp">'+sel(others[0].id,others.map(x=>[x.id,x.name]))+'</select></div>':''),foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn danger" data-act="deleteLocationOk" data-id="'+esc(d.id)+'">Verwijderen</button>'})};
A.deleteLocationOk=d=>{const to=$('#dl-to')?$('#dl-to').value:null;const name=M.locName(d.id);M.deleteLocation(d.id,to);closeModal();if(UI.params.id===d.id)go('opslag');toast('"'+name+'" verwijderd.')};

/* ---------- VERVALDATUMS ---------- */
VIEW_RENDER.vervaldata=function(){const f=UI.exp;const t=M.settings().thresholds;
  let h='<div class="toolbar"><select class="inp" style="max-width:240px" data-change="expFilter" data-k="loc"><option value="">Alle opslagplaatsen</option>'+sel(f.loc,M.locations().map(l=>[l.id,l.name]))+'</select><select class="inp" style="max-width:220px" data-change="expFilter" data-k="type"><option value="">Alle datumtypes</option>'+sel(f.type,[['TGT','TGT'],['THT','THT'],['EIGEN','Eigen datum'],['OPEN','Na opening']])+'</select><span class="grow"></span><span class="small muted">Termijnen instelbaar in Instellingen</span></div>';
  h+='<div class="note" style="margin-bottom:14px"><b>TGT</b> (te gebruiken tot) = uiterste veilige datum: na die datum niet meer gebruiken. <b>THT</b> (ten minste houdbaar tot) = kwaliteitsdatum: daarna vaak nog goed, maar eerst controleren.</div>';
  let ls=M.lots().filter(l=>(!f.loc||l.locationId===f.loc));const rows=ls.map(l=>({l,p:M.S.products[l.productId],e:M.lotExpiry(l)})).filter(x=>x.p&&(!f.type||x.e.type===f.type));
  const groups=[['expired','Vervallen'],['red','Nog 0–'+t.red+' dagen'],['orange','Nog '+(t.red+1)+'–'+t.orange+' dagen'],['yellow','Nog '+(t.orange+1)+'–'+t.yellow+' dagen'],['ok','Meer dan '+t.yellow+' dagen'],['none','Geen vervaldatum ingevuld']];
  groups.forEach(g=>{const items=rows.filter(x=>x.e.level===g[0]).sort((a,b)=>(a.e.days==null?1e9:a.e.days)-(b.e.days==null?1e9:b.e.days));if(!items.length)return;
    h+='<section class="card" style="margin-bottom:14px" data-glean-id="exp-'+g[0]+'"><h2 class="panel-title"><span class="tag lv-'+g[0]+'">'+items.length+'</span> '+esc(g[1])+'</h2><div class="list">';
    items.slice(0,g[0]==='ok'?40:500).forEach(x=>{const w=M.expiryWarning(x.e,M.isFreezer(x.l.locationId));const ok=M.suitable(x.l);
      h+='<div class="li" data-glean-id="explot-'+esc(x.l.id)+'">'+daysBadge(x.e)+'<div class="grow" style="min-width:0"><div class="main-t" style="cursor:pointer" data-act="product" data-id="'+esc(x.p.id)+'">'+esc(x.p.name)+'</div><div class="sub-t">'+esc(fmtQty(x.l.qty,x.l.unit))+' · '+esc(M.locName(x.l.locationId))+' · '+(x.e.date?typeTag(x.e)+' '+fmtDate(x.e.date):'')+(x.l.freezeDate?' · ❄ '+fmtDate(x.l.freezeDate):'')+'</div>'+(w&&(g[0]==='expired'||g[0]==='none')?'<div class="warn-txt'+(!ok?' tgt':'')+'">⚠ '+esc(w)+'</div>':'')+'</div><div class="acts">'+
        (g[0]==='none'?'<button type="button" class="btn sm" data-act="editLot" data-id="'+esc(x.l.id)+'">Datum invullen</button>':ok?'<button type="button" class="btn sm" data-act="useUpLot" data-id="'+esc(x.l.id)+'">✓ Opgebruikt</button><button type="button" class="btn sm" data-act="useLot" data-id="'+esc(x.l.id)+'">Deel</button>':'')+'<button type="button" class="btn sm" data-act="moveLot" data-id="'+esc(x.l.id)+'">⇄</button><button type="button" class="btn sm danger" data-act="discardLot" data-id="'+esc(x.l.id)+'">🗑</button></div></div>'});
    if(g[0]==='ok'&&items.length>40)h+='<div class="small muted" style="padding:8px">+ '+(items.length-40)+' andere</div>';h+='</div></section>'});
  if(!rows.length)h+='<div class="card empty">Geen producten gevonden.</div>';return h};

const TF_URL='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
const MOBILENET_URL='https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js';
/* ImageNet-klassen die voedsel zijn -> Nederlandse productnaam */
const FOOD={'granny smith':'Appel','strawberry':'Aardbeien','orange':'Sinaasappel','lemon':'Citroen','fig':'Vijgen','pineapple':'Ananas','banana':'Bananen','jackfruit':'Jackfruit','custard apple':'Cherimoya','pomegranate':'Granaatappel',
  'head cabbage':'Witte kool','broccoli':'Broccoli','cauliflower':'Bloemkool','zucchini':'Courgette','spaghetti squash':'Spaghettipompoen','acorn squash':'Pompoen','butternut squash':'Butternutpompoen','cucumber':'Komkommer','artichoke':'Artisjok','bell pepper':'Paprika','cardoon':'Kardoen','corn':'Maïs','ear':'Maïskolf',
  'mushroom':'Champignons','agaric':'Paddenstoelen','bolete':'Eekhoorntjesbrood','hen-of-the-woods':'Maitake','hip':'Rozenbottels',
  'guacamole':'Guacamole','consomme':'Bouillon','hot pot':'Stoofpot','trifle':'Trifle','ice cream':'Roomijs','ice lolly':'Waterijsjes','french loaf':'Stokbrood','bagel':'Bagels','pretzel':'Pretzels','cheeseburger':'Hamburgers','hotdog':'Hotdogs','mashed potato':'Puree','carbonara':'Pasta carbonara','chocolate sauce':'Chocoladesaus','dough':'Deeg','meat loaf':'Gehaktbrood','pizza':'Pizza','potpie':'Pastei','burrito':'Burrito','honeycomb':'Honing',
  'red wine':'Rode wijn','espresso':'Koffie','eggnog':'Advocaat','beer bottle':'Bier','wine bottle':'Wijn','pop bottle':'Frisdrank','water bottle':'Water',
  'american lobster':'Kreeft','spiny lobster':'Langoest','crayfish':'Rivierkreeft','dungeness crab':'Krab','rock crab':'Krab','king crab':'Koningskrab'};
const Vision={model:null,loading:null,
  async load(){if(this.model)return this.model;
    if(!this.loading)this.loading=(async()=>{ocrProgress(0.1,'Herkenningsmodel laden (eerste keer ±20 MB, daarna offline)…');await loadScript(TF_URL);ocrProgress(0.4,'Herkenningsmodel laden…');await loadScript(MOBILENET_URL);
      if(!window.mobilenet)throw new Error('herkenningsmodel niet beschikbaar');ocrProgress(0.6,'Model voorbereiden…');const m=await window.mobilenet.load({version:2,alpha:1});this.model=m;return m})().catch(e=>{this.loading=null;throw e});
    return this.loading},
  async classify(canvas){const m=await this.load();ocrProgress(0.85,'Voedsel herkennen…');const preds=await m.classify(canvas,10);ocrProgress(1,'Klaar');setTimeout(()=>{const b=$('.modal #ocr-prog')||$('#ocr-prog');if(b)b.style.display='none'},800);return preds||[]}};
function foodMatches(preds){const out=[];(preds||[]).forEach(p=>{const names=String(p.className||'').toLowerCase().split(',').map(s=>s.trim());
    for(const n of names){const nm=FOOD[n];if(nm){if(!out.some(o=>o.name===nm))out.push({name:nm,prob:Number(p.probability)||0,label:n});break}}});
  return out.filter(o=>o.prob>=0.05).slice(0,4)}
function foodNames(list){return list.map(f=>f.name+' ('+Math.round(f.prob*100)+'%)').join(', ')}
async function recogniseFood(canvas){try{const preds=await Vision.classify(canvas);return {foods:foodMatches(preds),err:''}}
  catch(e){const b=$('.modal #ocr-prog')||$('#ocr-prog');if(b)b.style.display='none';return {foods:[],err:e.message||String(e)}}}
/* scanmodus "Voedsel herkennen" */
async function runFood(canvas){const r=await recogniseFood(canvas);const best=r.foods[0];const thumb=thumbOf(canvas);
  const pref={source:'voedselherkenning',photoCandidate:thumb,usePhoto:true,name:best&&best.prob>=0.25?best.name:'',qty:1,unit:'stuks',aiFoods:r.foods,needsCheck:false};
  if(pref.name){const ex=M.findProductByName(pref.name,'');if(ex)Object.assign(pref,prefFromProduct(ex),{photoCandidate:thumb})}
  pref.info=r.err?'Voedselherkenning niet beschikbaar ('+r.err+'). Het model wordt de eerste keer van internet geladen — controleer je verbinding. Typ de naam zelf in.'
    :best?(pref.name?'Herkend: '+best.name+' ('+Math.round(best.prob*100)+'% zeker). Klopt het niet? Kies hieronder een ander voorstel of typ de naam.':'Niet zeker genoeg. Kies een voorstel hieronder of typ de naam.')
    :'Geen voedsel herkend. Fotografeer van dichterbij, met één product in beeld — of typ de naam zelf.';
  pref.infoKind=r.err||!best?'warn':'';openConfirm(pref)}

A.cfOcr=async(d,el)=>{const f=el.files&&el.files[0];el.value='';if(!f)return;cfSnapshot();CF.ai={busy:'Verpakking lezen…'};paintModal();
  const {canvas}=await resizeImage(f,2000,0.85);const o=await ocrRead(canvas,false);const p=CF.pref;const fl=o.parsed.fields;const filled=[];
  const put=(k,v,lbl)=>{if(v!=null&&v!==''&&!p[k]){p[k]=v;filled.push(lbl)}};
  if(!o.err){put('name',fl.name,'naam');put('brand',fl.brand,'merk');if(fl.qty&&(!p.qty||p.qty===1)){p.qty=fl.qty;p.unit=fl.unit||p.unit;filled.push('inhoud')}
    if(fl.category&&!p.category){p.category=fl.category;p.sub=fl.sub||''}else if(!p.category&&p.name){const c=classify(p.name);if(c){p.category=c.category;p.sub=c.sub}}
    if(fl.expiryDate&&!p.expiryDate){p.expiryDate=fl.expiryDate;p.dateType=fl.dateType||'THT';filled.push('vervaldatum')}
    if(!CF.photo&&o.thumb)CF.photo=o.thumb;p.ocrText=o.text;p.ocrConf=o.conf}

  paintModal();if(!o.err)await findCandidates();if(typeof A11y!=='undefined')A11y.say(CF.ai.msg+(CF.ai.cands&&CF.ai.cands.length?' '+CF.ai.cands.length+' mogelijke producten gevonden.':''))};

  catch(e){CF.ai.cands=[];CF.ai.msg=(CF.ai.msg?CF.ai.msg+' ':'')+'Open Food Facts niet bereikbaar ('+e.message+').'}

  CF.ai.msg='Overgenomen: '+c.name+(c.brand?' · '+c.brand:'')+'. Controleer inhoud en datum.';CF.ai.kind='';paintModal();if(typeof A11y!=='undefined')A11y.say(CF.ai.msg)};
A.cfFood=async(d,el)=>{const f=el.files&&el.files[0];el.value='';if(!f)return;cfSnapshot();CF.ai={busy:'Voedsel herkennen…'};paintModal();
