function openRecipe(id,o){const r=M.recipeById(id);if(!r)throw new Error('Recept niet gevonden.');o=o||{};const pe=o.planKey&&M.S.plan[o.planKey];RS={id,planKey:o.planKey||'',servings:(pe&&pe.servings)||M.effServings()};
  openModal({title:(r.emoji||'🍽️')+' '+r.name,gid:'dialog-recipe',wide:true,body:recipeBody,foot:()=>{const pe=RS.planKey&&M.S.plan[RS.planKey];return (r.custom?'<button type="button" class="btn sm ghost" data-act="editRecipe" data-id="'+esc(r.id)+'">✎ Bewerken</button>':'<button type="button" class="btn sm ghost" data-act="hideRecipe" data-id="'+esc(r.id)+'">Verbergen</button>')+'<span class="grow"></span><button type="button" class="btn" data-act="planRecipe" data-id="'+esc(r.id)+'">📅 In weekmenu</button><button type="button" class="btn" data-act="recMissing" data-id="'+esc(r.id)+'">🛒 Ontbrekende op lijst</button><button type="button" class="btn primary" data-act="cookRecipe" data-id="'+esc(r.id)+'"'+(pe&&pe.cooked?' disabled':'')+'>🍳 Bereid &amp; afboeken</button>'}})}
function recipeBody(){const r=M.recipeById(RS.id);const ev=M.evalRecipe(r,{servings:RS.servings});const pe=RS.planKey&&M.S.plan[RS.planKey];
  let h='<div class="row"><span class="tag">⏱ '+r.time+' min</span><span class="tag">'+esc(r.diff)+'</span><span class="tag">'+(r.meals||[]).map(m=>MEAL_LABEL[m]).join(' / ')+'</span><label class="row small nowrap" style="gap:6px;margin-left:auto"><span title="'+esc(householdLine())+'">Porties</span> <select class="inp" style="width:auto;min-height:32px;padding:4px 8px" data-change="rsServ">'+sel(RS.servings,servingOpts(RS.servings))+'</select></label></div>';
  if(pe)h+='<div class="note">📅 Gepland: '+esc(fmtDateLong(pe.date))+' · '+esc(MEAL_LABEL[pe.meal])+(pe.cooked?' · ✓ al bereid':'')+'</div>';
  if(ev.urgentUses.length)h+='<div class="note warn">♻ Dit recept gebruikt producten die bijna vervallen: '+ev.urgentUses.map(u=>'<b>'+esc(u.name)+'</b> ('+(u.days<0?'vervallen':u.days===0?'vandaag':u.days+' d')+')').join(', ')+'</div>';
  h+='<div><div class="eyebrow" style="margin-bottom:4px">Ingrediënten · '+ev.haveN+'/'+ev.reqN+' in huis</div><div class="hint" style="margin-bottom:6px">Per ingrediënt is de oudste geschikte partij (FIFO) voorgeselecteerd. Kies zelf een andere partij of pas de hoeveelheid aan.</div>';
  ev.ings.forEach((i,ix)=>{const st=i.status;const icon=st==='ok'?'<span class="st-ok">✓</span>':st==='approx'?'<span class="st-ok">≈</span>':st==='partial'?'<span class="st-part">◐</span>':st==='basis'?'<span class="st-opt">·</span>':st==='optional'?'<span class="st-opt">○</span>':'<span class="st-miss">✕</span>';
    h+='<div class="ing" data-ing="'+ix+'">'+icon+'<div style="min-width:0"><div><b>'+esc(i.ing.n)+'</b> <span class="muted">'+esc(fmtQty(i.need,i.unit))+'</span>'+(i.ing.opt?' <span class="tag">optioneel</span>':'')+(i.ing.basis?' <span class="tag">basisvoorraad</span>':'')+'</div>';
    if(i.allocs.length){i.allocs.forEach((a,ai)=>{h+='<div class="row nowrap small" style="margin-top:5px" data-alloc><select class="inp" style="min-height:32px;padding:4px 8px" data-lot>'+sel(a.lotId,i.cands.map(c=>{const l=M.S.lots[c.lotId],p=M.S.products[c.productId],e=M.lotExpiry(l);return [c.lotId,p.name+' · '+fmtQty(l.qty,l.unit)+' · '+M.locName(l.locationId)+' · '+(e.date?TYPE_SHORT[e.type]+' '+fmtDate(e.date):'geen datum')]}))+'</select><input class="inp" style="width:96px;min-height:32px;padding:4px 8px" type="number" step="any" min="0" value="'+a.qty+'" data-q aria-label="Hoeveelheid"><span class="muted">'+esc(a.unit)+'</span></div>'});
      if(i.short>0)h+='<div class="small st-part">Nog '+esc(fmtQty(i.short,i.unit))+' tekort</div>';if(i.status==='approx')h+='<div class="small muted">Eenheid kon niet exact omgerekend worden — controleer de hoeveelheid.</div>'}
    else if(st==='missing')h+='<div class="small st-miss">Niet in huis</div>';else if(st==='basis')h+='<div class="small muted">Meestal in huis (kruiden/basis) — niet afgeboekt</div>';else if(st==='optional')h+='<div class="small muted">Optioneel, niet in huis</div>';
    h+='</div><div class="small muted" style="text-align:right">'+(i.urgent.length?'<span class="tag lv-'+i.urgent[0].level+'">'+(i.urgent[0].days<0?'vervallen':i.urgent[0].days+' d')+'</span>':'')+(i.opened?' <span class="tag">geopend</span>':'')+'</div></div>'});
  h+='</div>';if(r.steps&&r.steps.length)h+='<div><div class="eyebrow" style="margin-bottom:6px">Bereiding</div><ol style="margin:0;padding-left:20px">'+r.steps.map(s=>'<li style="margin-bottom:4px">'+esc(s)+'</li>').join('')+'</ol></div>';return h}
A.rsServ=(d,el)=>{RS.servings=Number(el.value);paintModal()};
A.cookRecipe=d=>{const r=M.recipeById(d.id);const allocs=[];const used={};$$('.modal [data-alloc]').forEach(row=>{const lotId=row.querySelector('[data-lot]').value;const q=Number(row.querySelector('[data-q]').value)||0;if(q<=0)return;const l=M.S.lots[lotId];if(!l)return;used[lotId]=(used[lotId]||0)+q;if(used[lotId]>l.qty+0.0005)throw new Error('Te veel gekozen uit één partij: '+M.S.products[l.productId].name+' (max '+fmtQty(l.qty,l.unit)+').');allocs.push({lotId,qty:q})});
  if(!allocs.length)throw new Error('Er is niets om af te boeken.');const pk=RS.planKey;closeModal();const n=withUndo(r.name+' bereid — '+plural(allocs.length,'partij','partijen')+' afgeboekt.',()=>M.cookRecipe(r,allocs,{planKey:pk}));void n};
A.recMissing=d=>{const r=M.recipeById(d.id);const ev=M.evalRecipe(r,{servings:RS?RS.servings:undefined});if(!ev.missing.length){toast('Je hebt alle ingrediënten al in huis.');return}M.tx(()=>ev.missing.forEach(i=>M.addShopping({name:i.ing.n,qty:i.unit==='stuks'?Math.ceil(i.short||i.need):(i.short||i.need),unit:i.unit,auto:'weekmenu',note:'Voor '+r.name})));toast(plural(ev.missing.length,'ingrediënt','ingrediënten')+' op je boodschappenlijst gezet.')};
A.hideRecipe=d=>{const h=Object.assign({},M.state().hiddenRecipes||{});h[d.id]=true;M.saveState({hiddenRecipes:h});closeModal();toast('Recept verborgen. Terugzetten kan via "Mijn recepten".')};
A.planRecipe=d=>{const ws=weekStart();const opts=[];[0,1].forEach(w=>M.weekDates(addDays(ws,w*7)).forEach(dt=>{if(dt>=todayStr())opts.push([dt,fmtDateLong(dt)])}));const r=M.recipeById(d.id);
  openModal({title:'In weekmenu plannen',gid:'dialog-plan',body:'<div style="font-weight:600">'+esc(r.name)+'</div><div class="grid2"><div class="field"><label>Dag</label><select id="pl-d" class="inp">'+sel(opts[0][0],opts)+'</select></div><div class="field"><label>Maaltijd</label><select id="pl-m" class="inp">'+sel((r.meals||['avond'])[0],M.MEALS.map(m=>[m,MEAL_LABEL[m]]))+'</select></div></div><div class="hint">Staat er al een gerecht, dan wordt het vervangen.</div>',foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="planOk" data-id="'+esc(d.id)+'">Plannen</button>'})};
A.planOk=d=>{const dt=$('#pl-d').value,m=$('#pl-m').value;M.setPlan(dt,m,d.id,RS?RS.servings:undefined);closeAllModals();toast('Gepland op '+fmtDateLong(dt)+' ('+MEAL_LABEL[m]+').')};

/* ---------- Weekplanner ---------- */
function weekView(){const ws=weekStart();const ew=M.evalWeek(ws);const miss=M.weekMissing(ws);const t=todayStr();const dates=M.weekDates(ws);
  let h='<div class="toolbar"><button type="button" class="btn" data-act="wkNav" data-d="-7" aria-label="Vorige week">‹</button><b>Week '+fmtDate(ws).slice(0,5)+' – '+fmtDate(dates[6]).slice(0,5)+'</b><button type="button" class="btn" data-act="wkNav" data-d="7" aria-label="Volgende week">›</button><button type="button" class="btn ghost" data-act="wkNav" data-d="0">Deze week</button><span class="grow"></span><button type="button" class="btn" data-act="wkMissing" '+(miss.length?'':'disabled')+'>🛒 Ontbrekende → lijst ('+miss.length+')</button><button type="button" class="btn ghost" data-act="wkClear">Week leegmaken</button><button type="button" class="btn primary" data-act="wkGen">✨ Genereer mijn weekmenu</button></div>';
  const allUrg=new Set();Object.values(ew).forEach(x=>x.ev&&x.ev.urgentUses.forEach(u=>allUrg.add(u.lotId)));const ufAll=M.useFirst().filter(x=>x.e.level!=='expired'||x.e.type!=='TGT');const unplanned=ufAll.filter(x=>!allUrg.has(x.l.id));
  if(ufAll.length)h+='<div class="note'+(unplanned.length?' warn':'')+'" style="margin-bottom:12px">♻ '+(unplanned.length?'Nog niet ingepland en bijna vervallen: '+unplanned.slice(0,6).map(x=>'<b>'+esc(x.p.name)+'</b> ('+(x.e.days<0?'vervallen':x.e.days+' d')+')').join(', ')+'. "Genereer" geeft deze voorrang.':'Alle bijna vervallen producten zitten in je weekmenu. 👍')+'</div>';
  h+='<div class="week"><div class="wh"></div>'+M.MEALS.map(m=>'<div class="wh">'+MEAL_LABEL[m]+'</div>').join('');
  dates.forEach(dt=>{h+='<div class="wd'+(dt===t?' today':'')+'">'+esc(WEEKDAYS[(new Date(dt+'T00:00:00Z').getUTCDay()+6)%7].replace(/^./,c=>c.toUpperCase()))+'<small>'+fmtDate(dt).slice(0,5)+(dt===t?' · vandaag':'')+'</small></div>';
    M.MEALS.forEach(m=>{const k=M.planKey(dt,m);const x=ew[k];
      if(!x){h+='<div class="cell" data-meal="'+MEAL_LABEL[m]+'" data-drop="'+esc(k)+'" data-glean-id="plan-'+esc(k)+'"><button type="button" class="add" data-act="wkPick" data-key="'+esc(k)+'">+ Kies gerecht</button></div>';return}
      if(!x.recipe){h+='<div class="cell filled" data-meal="'+MEAL_LABEL[m]+'" data-glean-id="plan-'+esc(k)+'"><div class="small muted">Recept verwijderd</div><div class="c-acts"><button type="button" data-act="wkDel" data-key="'+esc(k)+'">✕ Verwijder</button></div></div>';return}
      const r=x.recipe,ev=x.ev;h+='<div class="cell filled'+(x.cooked?' cooked':'')+'" draggable="'+(!x.cooked)+'" data-drag="'+esc(k)+'" data-drop="'+esc(k)+'" data-meal="'+MEAL_LABEL[m]+'" data-glean-id="plan-'+esc(k)+'"><div class="c-name" data-act="recipe" data-id="'+esc(r.id)+'" data-plan="'+esc(k)+'">'+esc(r.emoji||'🍽️')+' '+esc(r.name)+'</div><div class="small muted">⏱ '+r.time+' min · '+x.entry.servings+' p.</div>'+
        (x.cooked?'<div class="small st-ok">✓ Bereid</div>':'<div class="small">'+(ev.allHave?'<span class="st-ok">✓ alles in huis</span>':'<span class="st-part">'+ev.missing.length+' ontbreekt</span>')+'</div>'+(ev.urgentUses.length?'<div class="small" style="color:var(--artifact-red)">♻ '+ev.urgentUses.slice(0,2).map(u=>esc(u.name)).join(', ')+'</div>':''))+
        '<div class="c-acts">'+(x.cooked?'':'<button type="button" data-act="recipe" data-id="'+esc(r.id)+'" data-plan="'+esc(k)+'">🍳 Bereid</button><button type="button" data-act="wkPick" data-key="'+esc(k)+'">↻ Vervang</button><button type="button" data-act="wkMove" data-key="'+esc(k)+'">⇄ Verplaats</button>')+'<button type="button" data-act="wkDel" data-key="'+esc(k)+'" aria-label="Verwijderen">✕</button></div></div>'})});
  h+='</div><div class="hint" style="margin-top:10px">Sleep gerechten tussen dagen (desktop) of gebruik "Verplaats". De planner reserveert voorraad per maaltijd in volgorde van de week, zodat hetzelfde ingrediënt niet dubbel wordt ingepland.</div>';return h}
A.wkNav=d=>{const n=Number(d.d);UI.rec.week=n===0?mondayOf(todayStr()):addDays(weekStart(),n);render()};
A.wkDel=d=>{const e=M.S.plan[d.key];const r=e&&M.recipeById(e.recipeId);withUndo((r?r.name:'Gerecht')+' uit weekmenu verwijderd.',()=>M.del('plan',d.key))};
A.wkClear=()=>{const ws=weekStart();const keys=Object.keys(M.S.plan).filter(k=>{const e=M.S.plan[k];return e.date>=ws&&e.date<=addDays(ws,6)&&!e.cooked});if(!keys.length)return;confirmBox('Week leegmaken','Alle '+keys.length+' niet-bereide gerechten van deze week verwijderen?','Leegmaken',()=>withUndo('Week leeggemaakt.',()=>M.tx(()=>keys.forEach(k=>M.del('plan',k)))),true)};
A.wkMissing=()=>{const n=M.addWeekMissing(weekStart());toast(plural(n,'ontbrekend ingrediënt','ontbrekende ingrediënten')+' op je boodschappenlijst (dubbels samengevoegd).')};
A.wkGen=()=>{const g=UI.rec.gen||(UI.rec.gen={meals:{ontbijt:true,lunch:true,avond:true},f:M.household().children.some(k=>k.age>=1&&k.age<=12)?{kind:true}:{},overwrite:false,addMissing:true});
  openModal({title:'Genereer mijn weekmenu',gid:'dialog-generate',body:()=>'<div class="lbl">Maaltijden</div><div class="row">'+M.MEALS.map(m=>'<label class="check"><input type="checkbox" '+(g.meals[m]?'checked':'')+' data-change="genMeal" data-m="'+m+'"> '+MEAL_LABEL[m]+'</label>').join('')+'</div><div class="lbl">Voorkeuren</div><div class="row">'+filterChips(g.f,'genF')+'</div><div class="field" style="max-width:260px"><label>Porties</label><select class="inp" data-change="genServ">'+sel(g.servings||M.effServings(),servingOpts(g.servings||M.effServings()))+'</select><div class="hint" style="margin-top:4px">'+esc(householdLine())+'</div></div><label class="check"><input type="checkbox" '+(g.overwrite?'checked':'')+' data-change="genOpt" data-k="overwrite"> Bestaande (niet-bereide) gerechten vervangen</label><label class="check"><input type="checkbox" '+(g.addMissing?'checked':'')+' data-change="genOpt" data-k="addMissing"> Ontbrekende ingrediënten op de boodschappenlijst zetten</label><div class="note">De generator geeft voorrang aan producten die bijna vervallen, geopende verpakkingen en restjes, houdt rekening met beschikbare hoeveelheden en zorgt voor variatie. Voorbije dagen worden overgeslagen.</div>',
    foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="genOk">✨ Genereer</button>'})};
A.genMeal=(d,el)=>{UI.rec.gen.meals[d.m]=el.checked};A.genOpt=(d,el)=>{UI.rec.gen[d.k]=el.checked};A.genServ=(d,el)=>{UI.rec.gen.servings=Number(el.value)};A.genF=d=>{UI.rec.gen.f[d.k]=!UI.rec.gen.f[d.k];paintModal()};
A.genOk=()=>{const g=UI.rec.gen;const meals=M.MEALS.filter(m=>g.meals[m]);if(!meals.length)throw new Error('Kies minstens één maaltijd.');const ws=weekStart();closeModal();
  const r=withUndo('Weekmenu gegenereerd.',()=>M.generateWeek(ws,{meals,filters:g.f,overwrite:g.overwrite,addMissing:g.addMissing,servings:g.servings}));toast(plural(r.added,'gerecht','gerechten')+' ingepland'+(g.addMissing?' · '+plural(r.shop,'ontbrekend ingrediënt','ontbrekende ingrediënten')+' op je lijst':'')+(r.added===0?' — geen vrije plaatsen of geen passende recepten.':'.'))};
A.wkPick=d=>{const [date,meal]=d.key.split('|');UI.rec.pick={key:d.key,date,meal,f:{},q:''};openModal({title:'Gerecht kiezen · '+fmtDateLong(date)+' · '+MEAL_LABEL[meal],gid:'dialog-pick',wide:true,live:false,body:pickBody})};
function pickBody(){const pk=UI.rec.pick;const ew=M.evalWeek(weekStart());const reserved={};Object.entries(ew).forEach(([k,x])=>{if(k===pk.key||!x.ev)return;x.ev.ings.forEach(i=>i.allocs.forEach(a=>{reserved[a.lotId]=(reserved[a.lotId]||0)+a.qty}))});
  const evs=M.allRecipes().filter(r=>!pk.allMeals?(r.meals||[]).includes(pk.meal):true).map(r=>M.evalRecipe(r,{reserved,ref:pk.date})).filter(ev=>M.passesFilter(ev.recipe,ev,Object.assign({},pk.f,{q:pk.q}))).sort((a,b)=>b.score-a.score);
  return '<div class="row"><input id="pick-q" class="inp" style="max-width:220px" placeholder="Zoek…" value="'+esc(pk.q)+'" data-input="pickQ">'+filterChips(pk.f,'pickF')+'<label class="check small"><input type="checkbox" '+(pk.allMeals?'checked':'')+' data-change="pickAll"> Alle maaltijdtypes</label></div><div class="hint">Beschikbaarheid houdt rekening met de andere geplande maaltijden van deze week.</div><div class="list" id="pick-list">'+(evs.length?evs.slice(0,40).map(ev=>'<div class="li" style="cursor:pointer" data-act="pickOk" data-id="'+esc(ev.recipe.id)+'"><div class="thumb">'+esc(ev.recipe.emoji||'🍽️')+'</div><div class="grow"><div class="main-t">'+esc(ev.recipe.name)+'</div><div class="sub-t">⏱ '+ev.recipe.time+' min · '+(ev.allHave?'<span class="st-ok">alles in huis</span>':'<span class="st-part">'+ev.missing.length+' ontbreekt</span>')+(ev.urgentUses.length?' · <span style="color:var(--artifact-red)">♻ '+ev.urgentUses.slice(0,2).map(u=>esc(u.name)).join(', ')+'</span>':'')+'</div></div><span class="btn sm">Kies</span></div>').join(''):'<div class="empty">Geen recepten voor deze filters.</div>')+'</div>'}
A.pickQ=(d,el)=>{UI.rec.pick.q=el.value;const pos=el.selectionStart;paintModal();const n=$('#pick-q');n.focus();n.setSelectionRange(pos,pos)};A.pickF=d=>{UI.rec.pick.f[d.k]=!UI.rec.pick.f[d.k];paintModal()};A.pickAll=(d,el)=>{UI.rec.pick.allMeals=el.checked;paintModal()};
A.pickOk=d=>{const pk=UI.rec.pick;const prev=M.S.plan[pk.key];M.setPlan(pk.date,pk.meal,d.id,prev&&prev.servings);closeModal();toast(M.recipeById(d.id).name+' ingepland.')};
A.wkMove=d=>{const opts=[];const ws=weekStart();[0,1].forEach(w=>M.weekDates(addDays(ws,w*7)).forEach(dt=>M.MEALS.forEach(m=>opts.push([M.planKey(dt,m),fmtDateLong(dt)+' · '+MEAL_LABEL[m]+(M.S.plan[M.planKey(dt,m)]?' (wisselen)':'')]))));
  openModal({title:'Gerecht verplaatsen',gid:'dialog-plan-move',body:'<div class="field"><label>Naar</label><select id="mvp-to" class="inp">'+sel(d.key,opts)+'</select></div><div class="hint">Staat daar al een gerecht, dan worden beide gewisseld.</div>',foot:'<button type="button" class="btn" data-act="closeModal">Annuleren</button><button type="button" class="btn primary" data-act="wkMoveOk" data-key="'+esc(d.key)+'">Verplaatsen</button>'})};
A.wkMoveOk=d=>{const [dt,m]=$('#mvp-to').value.split('|');M.movePlan(d.key,dt,m);closeModal();toast('Verplaatst naar '+fmtDateLong(dt)+' · '+MEAL_LABEL[m]+'.')};
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();$$('.cell.drop').forEach(x=>x!==c&&x.classList.remove('drop'));c.classList.add('drop')});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('drop')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('drop');const from=e.dataTransfer.getData('text/plain');if(!from||from===c.dataset.drop)return;const [dt,m]=c.dataset.drop.split('|');M.movePlan(from,dt,m)});

/* ---------- Mijn recepten ---------- */
function myRecipes(){const mine=Object.values(M.S.recipes).sort((a,b)=>a.name.localeCompare(b.name));const hidden=Object.keys(M.state().hiddenRecipes||{}).map(id=>BUILTIN_RECIPES.find(r=>r.id===id)).filter(Boolean);
  let h='<div class="toolbar"><div class="grow muted small">'+BUILTIN_RECIPES.length+' ingebouwde recepten + '+mine.length+' eigen recepten</div><button type="button" class="btn primary" data-act="editRecipe">+ Nieuw recept</button></div>';
  h+='<div class="card" data-glean-id="my-recipes">'+(mine.length?'<div class="list">'+mine.map(r=>'<div class="li"><div class="thumb">'+esc(r.emoji||'🍽️')+'</div><div class="grow"><div class="main-t" style="cursor:pointer" data-act="recipe" data-id="'+esc(r.id)+'">'+esc(r.name)+'</div><div class="sub-t">'+r.ing.length+' ingrediënten · ⏱ '+r.time+' min · '+(r.meals||[]).map(m=>MEAL_LABEL[m]).join(', ')+'</div></div><button type="button" class="btn sm" data-act="editRecipe" data-id="'+esc(r.id)+'">✎</button><button type="button" class="btn sm danger" data-act="delRecipe" data-id="'+esc(r.id)+'">🗑</button></div>').join('')+'</div>':'<div class="empty">Nog geen eigen recepten. Voeg je familieklassiekers toe — ze worden meteen gebruikt in suggesties en het weekmenu.</div>')+'</div>';

  if(!(q>0))throw new Error('Geef een hoeveelheid groter dan 0.');q=Math.min(q,l.qty);const all=q>=l.qty-0.0005;

const SYNC_BATCH=400;

function defaultDeviceName(){const ua=(typeof navigator!=='undefined'&&navigator.userAgent)||'';return /Android/i.test(ua)?'Android-telefoon':/iPhone|iPad/i.test(ua)?'iPhone/iPad':/Windows/i.test(ua)?'Windows-pc':/Macintosh/i.test(ua)?'Mac':'Browser'}
function fmtDT(d){if(!d)return '—';d=d instanceof Date?d:new Date(d);if(isNaN(d))return '—';return fmtDate(todayStr(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function parsePairCode(code){code=String(code||'').trim().replace(/\s+/g,'');if(!/^SVB1:/.test(code))throw new Error('Dit is geen geldige koppelcode. Die begint met "SVB1:" — kopieer hem opnieuw uit je Google Sheet.');
  let b=code.slice(5).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';let o;try{o=JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){throw new Error('De koppelcode is onvolledig. Kopieer hem opnieuw, volledig.')}

const APP_VERSION='2.4 · 21-11-2026';
async function syncDiagnose(url){const inGlean=!!(typeof window!=='undefined'&&window.GleanBridge);

  let reach=false;try{const ctl=typeof AbortController!=='undefined'?new AbortController():null;const to=setTimeout(()=>ctl&&ctl.abort(),10000);await fetch(url,{method:'GET',mode:'no-cors',cache:'no-store',signal:ctl?ctl.signal:undefined});clearTimeout(to);reach=true}catch(e){}
  return reach?'Google is bereikbaar, maar weigert de app. Tik op "Adres uit koppelcode testen" om te zien wat Google antwoordt. Meestal: zet bij Implementeren › Implementaties beheren › ✎ "Uitvoeren als" op "Ik" en "Wie heeft toegang" op "Iedereen" (niet "Iedereen met een Google-account"). Of het adres in de koppelcode is verouderd: plak de /exec-URL bij WEB_APP_URL in Code.gs en haal een nieuwe koppelcode op.'
    :'Kan Google niet bereiken. Iets blokkeert de verbinding met script.google.com: een adblocker of privacy-extensie, een bedrijfsnetwerk of VPN. Probeer een ander netwerk (bv. mobiele data) of zet de extensie uit voor deze site.'}
const Sync={cfg:null,outbox:{},applying:false,busy:false,again:false,err:'',fails:0,lastOk:null,info:null,orig:null,pending:null,_t:null,_ot:null,_poll:null,
  attach(ad){const self=this;this.orig={put:ad.put.bind(ad),del:ad.del.bind(ad)};
    ad.put=function(c,o){self.orig.put(c,o);if(!self.applying&&o&&o.id!=null)self.track(c,o.id)};
    ad.del=function(c,id){self.orig.del(c,id);if(!self.applying)self.track(c,id)};
    this.cfg=LS.get('sync',null);this.outbox=LS.get('outbox',{})||{};this.info=LS.get('syncInfo',null);const lo=LS.get('syncLast','');this.lastOk=lo?new Date(lo):null},
  count(){return Object.keys(this.outbox).length},
  track(c,id){if(!this.cfg)return;const k=c+'\u0001'+id,prev=this.outbox[k];this.outbox[k]={c,id:String(id),t:Math.max(Date.now(),prev?prev.t+1:0)};this.saveOutbox();this.soon(3000)},
  saveOutbox(now){const w=()=>{this._ot=null;LS.set('outbox',this.outbox)};if(now){if(this._ot)clearTimeout(this._ot);w();return}if(!this._ot)this._ot=setTimeout(w,150)},
  saveCfg(){LS.set('sync',this.cfg)},
  soon(ms){if(!this.cfg)return;if(this._t)clearTimeout(this._t);this._t=setTimeout(()=>{this._t=null;this.run(false)},ms)},
  start(){if(typeof window==='undefined')return;window.addEventListener('online',()=>this.soon(500));
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&this.cfg&&(!this.lastOk||Date.now()-this.lastOk>20000))this.soon(300);if(document.hidden)this.saveOutbox(true)});
    window.addEventListener('beforeunload',()=>this.saveOutbox(true));
    this._poll=setInterval(()=>{if(this.cfg&&!this.busy&&!document.hidden)this.run(false)},90000);if(this.cfg)this.soon(800)},
  async call(action,extra,cfg){cfg=cfg||this.cfg;const ctl=typeof AbortController!=='undefined'?new AbortController():null;const to=setTimeout(()=>{if(ctl)ctl.abort()},60000);
    try{const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:ctl?ctl.signal:undefined,
        body:JSON.stringify(Object.assign({action,key:cfg.key,device:deviceId(),deviceName:cfg.deviceName||defaultDeviceName(),client:1},extra||{}))});
      const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error(r.ok?'Onverwacht antwoord van Google. Controleer of de web-app gepubliceerd is met toegang "Iedereen".':'Google antwoordde met fout '+r.status+'.')}

  keepInfo(j){this.info={mailTo:j.mailTo||'',sheetUrl:j.sheetUrl||'',lastMail:j.lastMail||'',devices:j.devices||{}};LS.set('syncInfo',this.info)},
  applyChanges(list,force){if(!list||!list.length)return 0;let n=0;this.applying=true;
    try{M.tx(()=>{list.forEach(ch=>{if(!ch||!M.S[ch.c]||ch.id==null)return;const k=ch.c+'\u0001'+ch.id,ob=this.outbox[k];if(ob&&!force&&ob.t>ch.t)return;if(ob)delete this.outbox[k];
      const cur=M.S[ch.c][ch.id];if(ch.v==null){if(cur===undefined)return;M.applyRemote(ch.c,ch.id,null);this.orig.del(ch.c,ch.id)}else{if(cur&&JSON.stringify(cur)===JSON.stringify(ch.v))return;M.applyRemote(ch.c,ch.id,ch.v);this.orig.put(ch.c,ch.v)}n++})})}

  async run(manual){if(!this.cfg)return;if(this.busy){this.again=true;return this._p}

          got+=self.applyChanges(j.changes);self.cfg.since=j.rev;self.saveCfg();self.saveOutbox(true);self.keepInfo(j);
          if(!(j.more||self.count()>0||self.again)||++rounds>=25)break}
        self.lastOk=new Date();LS.set('syncLast',self.lastOk.toISOString());self.err='';self.fails=0;
        if(manual)toast('Gesynchroniseerd'+(got?' — '+plural(got,'wijziging','wijzigingen')+' ontvangen':'')+'.');return {ok:true,got}}
      catch(e){self.saveOutbox(true);self.err=e.message;self.fails++;if(e.auth)self.err='Koppeling geweigerd: '+e.message;
        if(manual)toast(self.err,'error');else if(self.fails<6)self.soon(Math.min(15000*Math.pow(2,self.fails),600000));return {ok:false,error:self.err}}
      finally{self.busy=false;updateSync();if(UI.view==='instellingen'&&UI.settingsTab==='sync')scheduleRender()}})();
    return this._p},
  queueAll(t){COLS.forEach(c=>Object.keys(M.S[c]).forEach(id=>{this.outbox[c+'\u0001'+id]={c,id,t:t==null?Date.now():t}}));this.saveOutbox(true)},
  async pullAll(cfg){let since=0,all=[],info=null;for(let i=0;i<60;i++){const j=await this.call('sync',{since,changes:[]},cfg);all=all.concat(j.changes||[]);since=j.rev;info=j;if(!j.more)break}return {changes:all,rev:since,info}},
  hasLocalData(){return M.products().length>0||Object.keys(M.S.lots).length>0||Object.keys(M.S.recipes).length>0||Object.keys(M.S.shopping).length>0||Object.keys(M.S.plan).length>0},
  async pair(code,name){const p=parsePairCode(code);const cfg={url:p.url,key:p.key,deviceName:(name||'').trim()||defaultDeviceName(),since:0};
    const j=await this.call('ping',{},cfg);const mode=!j.count?'upload':!this.hasLocalData()?'replace':'ask';this.pending={cfg,count:j.count,info:j};return mode},
  async finish(mode){const pd=this.pending;if(!pd)throw new Error('Geen koppeling bezig.');this.keepInfo(pd.info);const cfg=Object.assign({},pd.cfg,{pairedAt:nowISO()});
    if(mode==='replace'){const r=await this.pullAll(cfg);if(!r.changes.length)throw new Error('Er kwamen geen gegevens uit Google — er is niets vervangen.');
      this.applying=true;try{M.tx(()=>{COLS.forEach(c=>Object.keys(M.S[c]).forEach(id=>{M.applyRemote(c,id,null);this.orig.del(c,id)}))})}finally{this.applying=false}
      this.outbox={};this.applyChanges(r.changes,true);cfg.since=r.rev;this.cfg=cfg;this.saveCfg();this.saveOutbox(true);if(r.info)this.keepInfo(r.info);if(!M.isInitialized())M.initDefaults()}
    else{this.cfg=cfg;this.saveCfg();this.queueAll(mode==='merge'?0:null)}
    this.pending=null;if(Store.adapter&&Store.adapter.flushNow)Store.adapter.flushNow();const res=await this.run(false);return res},
  unpair(){this.cfg=null;this.outbox={};this.pending=null;this.err='';this.saveCfg();this.saveOutbox(true);LS.set('syncInfo',null);this.info=null;updateSync()}};

A.setTab=d=>{UI.settingsTab=d.tab;go('instellingen',{tab:d.tab})};
function setPath(path,val){const parts=path.split('.');const patch={};let o=patch;parts.forEach((p,i)=>{if(i===parts.length-1)o[p]=val;else{o[p]={};o=o[p]}});M.saveSettings(patch)}
A.setNum=(d,el)=>{const v=Number(el.value);if(!isFinite(v))return;if(d.path.startsWith('thresholds')){const t=Object.assign({},M.settings().thresholds);t[d.path.split('.')[1]]=v;if(!(t.red<t.orange&&t.orange<t.yellow)){toast('Termijnen moeten oplopen: rood < oranje < geel.','error');render();return}}setPath(d.path,v);toast('Opgeslagen.')};
const Theme={opts:[['auto','Automatisch'],['light','Licht'],['dark','Donker']],
  get(){const t=LS.get('theme','auto');return t==='light'||t==='dark'?t:'auto'},
  isDark(t){t=t||Theme.get();return t==='dark'||(t==='auto'&&!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))},
  apply(){const d=Theme.isDark();document.documentElement.setAttribute('data-theme',d?'dark':'light');const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0e1513':'#f3fbf8');const b=document.getElementById&&document.getElementById('theme-btn');if(b){const lbl=d?'Licht thema':'Donker thema';b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',lbl);b.setAttribute('title',lbl+(Theme.get()==='auto'?' (nu automatisch)':''));b.innerHTML=ico(d?'light_mode':'dark_mode',d?'☀️':'🌙')}},
  set(t){LS.set('theme',t);Theme.apply()},
  watch(){try{const q=matchMedia('(prefers-color-scheme: dark)');const f=()=>{if(Theme.get()==='auto')Theme.apply()};q.addEventListener?q.addEventListener('change',f):q.addListener(f)}catch(e){}}};
function themeSection(){const cur=Theme.get();return '<div class="section" data-glean-id="settings-theme"><h3>Weergave</h3><div class="seg" role="group" aria-label="Thema">'+Theme.opts.map(o=>'<button type="button" data-act="setTheme" data-t="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>').join('')+'</div><div class="hint" style="margin-top:6px">Automatisch volgt de instelling van je toestel (licht overdag, donker als je toestel in donkere modus staat). De keuze geldt per toestel.</div></div>'}
A.toggleTheme=()=>{const d=!Theme.isDark();Theme.set(d?'dark':'light');render();toast((d?'Donker':'Licht')+' thema aan. Wil je weer je toestel volgen? Kies Automatisch bij Instellingen › Algemeen.')};
function checkIconFont(){try{if(!document.fonts||!document.fonts.load)return;const ok=()=>document.documentElement.classList.add('msym-ok');if(document.fonts.check&&document.fonts.check('24px "Material Symbols Rounded"','home')&&[...document.fonts].some(f=>/Material Symbols/.test(f.family)&&f.status==='loaded')){ok();return}document.fonts.load('24px "Material Symbols Rounded"','home').then(l=>{if(l&&l.length)ok()}).catch(()=>{})}catch(e){}}

const DEMO_SIG=new Set(["Rundergehakt|Slager", "Kipfilet|Delhaize", "Spaghetti|Barilla", "Tomatenpuree|Boni", "Passata|Mutti", "Halfvolle melk|Inza", "Eieren|Boni", "Griekse yoghurt|Danone", "Geraspte kaas|Everyday", "Gekookte hesp|Herta", "Wortelen|", "Uien|", "Aardappelen|", "Basmatirijst|Lassie", "Kokosmelk|Santa Maria", "Rode currypasta|Santa Maria", "Diepvrieserwten|Iglo", "Zalmfilet|", "Restje groentesoep|", "Oregano|Verstegen", "Paprikapoeder|Ducros", "Melkchocolade|Côte d'Or", "Speculoos|Lotus", "Bananen|", "Volkorenbrood|", "Boter|Président", "Bloem|Everyday"]);
const DEMO_WIN=120000;
function findDemo(M){
  const t=x=>{const v=Date.parse(x||'');return isNaN(v)?null:v};
  const cand=M.products().filter(p=>DEMO_SIG.has((p.name||'')+'|'+(p.brand||'')));
  const empty={products:[],keep:[],lots:[],history:[],shopping:[],count:0};
  if(!cand.length)return empty;
  let marks=Object.values(M.S.history).filter(h=>h.action==='voorbeeld').map(h=>t(h.ts)).filter(v=>v!=null);
  if(!marks.length){/* geen markering: zoek een cluster van minstens 20 voorbeeldproducten die binnen 2 minuten zijn aangemaakt */
    const ts=cand.map(p=>t(p.createdAt)).filter(v=>v!=null).sort((a,b)=>a-b);
    for(let i=0;i<ts.length;i++){const n=ts.filter(v=>v>=ts[i]&&v<=ts[i]+DEMO_WIN).length;if(n>=20){marks=[ts[i]+DEMO_WIN/2];break}}}
  if(!marks.length)return empty;
  const near=x=>{const v=t(x);return v!=null&&marks.some(m=>Math.abs(v-m)<=DEMO_WIN)};
  const prods=cand.filter(p=>near(p.createdAt));if(!prods.length)return empty;
  const pids=new Set(prods.map(p=>p.id));const allLots=Object.values(M.S.lots).filter(l=>pids.has(l.productId));
  const lots=allLots.filter(l=>near(l.createdAt));const realPids=new Set(allLots.filter(l=>!near(l.createdAt)).map(l=>l.productId));
  const remove=prods.filter(p=>!realPids.has(p.id)),keep=prods.filter(p=>realPids.has(p.id));
  const rp=new Set(remove.map(p=>p.id)),lids=new Set(lots.map(l=>l.id));
  const history=Object.values(M.S.history).filter(h=>h.action==='voorbeeld'||rp.has(h.productId)||(h.lotId&&lids.has(h.lotId)));
  const shopping=Object.values(M.S.shopping).filter(s=>rp.has(s.productId));
  return {products:remove,keep,lots,history,shopping,count:remove.length+lots.length};
}
function removeDemo(M){const d=findDemo(M);if(!d.count)return d;
  M.tx(()=>{d.lots.forEach(l=>M.del('lots',l.id));d.shopping.forEach(s=>M.del('shopping',s.id));d.history.forEach(h=>M.del('history',h.id));d.products.forEach(p=>M.del('products',p.id))});
  d.keep.forEach(p=>{try{M.checkMinStock(p.id)}catch(e){}});return d}
function demoBanner(){const d=findDemo(M);if(!d.count)return '';
  return '<div class="note warn" style="margin-bottom:16px" data-glean-id="demo-banner"><b>Er staat nog voorbeelddata in je voorraad</b> ('+plural(d.products.length+d.keep.length,'product','producten')+', '+plural(d.lots.length,'partij','partijen')+'). Verwijder ze voordat je met je echte voorraad werkt; producten die je zelf hebt toegevoegd blijven staan.<div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-act="removeDemo">Voorbeelddata verwijderen</button></div></div>'}
A.removeDemo=()=>{const d=findDemo(M);if(!d.count){toast('Er staat geen voorbeelddata meer in je voorraad.');render();return}
  const keepTxt=d.keep.length?' '+plural(d.keep.length,'voorbeeldproduct blijft','voorbeeldproducten blijven')+' staan omdat je er zelf partijen aan toevoegde ('+d.keep.map(p=>p.name).join(', ')+'); alleen de voorbeeldpartijen ervan worden verwijderd.':'';
  confirmBox('Voorbeelddata verwijderen','Dit verwijdert '+plural(d.products.length,'voorbeeldproduct','voorbeeldproducten')+' en '+plural(d.lots.length,'voorbeeldpartij','voorbeeldpartijen')+(d.shopping.length?', '+plural(d.shopping.length,'boodschap','boodschappen')+' die erbij hoorden':'')+' en de bijbehorende geschiedenis. Ben je gekoppeld met Google, dan verdwijnen ze ook daar en op je andere toestellen. Je eigen producten, opslagplaatsen, recepten en instellingen blijven staan.'+keepTxt,'Verwijderen',()=>{const r=removeDemo(M);toast('Voorbeelddata verwijderd ('+plural(r.products.length,'product','producten')+', '+plural(r.lots.length,'partij','partijen')+').');render()},true)};

  get(){const o=LS.get('a11y',{});return Object.assign({},A11y.def,o&&typeof o==='object'?o:{})},
  set(k,v){const o=A11y.get();o[k]=v;LS.set('a11y',o);A11y.apply()},
  apply(){const o=A11y.get();const r=document.documentElement;if(!r)return;r.setAttribute('data-size',o.size);const cl=r.classList;if(cl){cl.toggle('hc',!!o.contrast);cl.toggle('big',!!o.big);cl.toggle('rm',!!o.motion)}},
  canSpeak(){return typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined'},
  voice(){try{const vs=speechSynthesis.getVoices()||[];return vs.find(v=>/^nl[-_]BE/i.test(v.lang))||vs.find(v=>/^nl[-_]NL/i.test(v.lang))||vs.find(v=>/^nl/i.test(v.lang))||null}catch(e){return null}},
  speak(text,force){const o=A11y.get();if((!force&&!o.speak)||!text||!A11y.canSpeak())return false;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[·•]/g,',').replace(/\s+/g,' ').trim());u.lang='nl-BE';const v=A11y.voice();if(v){u.voice=v;u.lang=v.lang}u.rate=Number(o.rate)||1;speechSynthesis.speak(u);A11y.last=u.text;return true}catch(e){return false}},
  say(text){return A11y.speak(text,false)},
  stop(){try{speechSynthesis.cancel()}catch(e){}},
  confirmOpened(){if(A11y.get().speak)setTimeout(()=>A11y.say(confirmSpeech()),250)}};
function unitWord(u){return ({g:'gram',kg:'kilo',ml:'milliliter',cl:'centiliter',l:'liter',stuks:'stuks',verpakkingen:'verpakkingen'})[u]||u||''}
function dayPhrase(days){if(days==null)return '';if(days<-1)return 'is '+(-days)+' dagen over datum';if(days===-1)return 'is gisteren vervallen';if(days===0)return 'vervalt vandaag';if(days===1)return 'vervalt morgen';return 'vervalt over '+days+' dagen'}
function confirmSpeech(){if(typeof CF==='undefined'||!CF||!CF.pref)return '';const p=CF.pref;const ex=p.existingProductId&&M.S.products[p.existingProductId];const parts=[];
  if(p.unknownBarcode)parts.push('Onbekend product. Barcode staat niet in de databank. Je kunt de verpakking laten lezen of de gegevens zelf invullen.');
  else if(p.name)parts.push((ex?'Gekend product: ':'Gevonden: ')+p.name+(p.brand?', merk '+p.brand:'')+(p.qty?', '+p.qty+' '+unitWord(p.unit):'')+'.');
  else parts.push('Nieuw product. Vul de productnaam in.');
  if(p.locationId&&M.S.locations[p.locationId])parts.push('Opslagplaats: '+M.locName(p.locationId)+'.');else parts.push('Kies nog een opslagplaats.');
  if(p.expiryDate)parts.push((p.dateType==='TGT'?'Te gebruiken tot ':'Ten minste houdbaar tot ')+fmtDate(p.expiryDate)+'.');else parts.push('Nog geen vervaldatum.');
  return parts.join(' ')}
A.cfSpeak=()=>{cfSnapshot();A11y.speak(confirmSpeech(),true)};
function expirySpeech(){const rows=M.lots().map(l=>({l,p:M.S.products[l.productId],e:M.lotExpiry(l)})).filter(x=>x.p&&x.e&&x.e.days!=null&&x.e.days<=7).sort((a,b)=>a.e.days-b.e.days);
  if(!rows.length)return 'Goed nieuws: deze week vervalt er niets.';
  const list=rows.slice(0,8).map(x=>x.p.name+', in '+M.locName(x.l.locationId)+', '+dayPhrase(x.e.days)).join('. ');
  return (rows.length===1?'Eén product':rows.length+' producten')+' vervallen binnen een week. '+list+'.'+(rows.length>8?' En nog '+(rows.length-8)+' andere.':'')}
A.speakExpiry=()=>{if(!A11y.speak(expirySpeech(),true))toast('Voorlezen wordt niet ondersteund in deze browser.','error')};
A.speakStop=()=>A11y.stop();
function a11yBar(){const o=A11y.get();if(!o.speak)return '';return '<div class="row" style="margin-bottom:16px" data-glean-id="a11y-bar"><button type="button" class="btn" data-act="speakExpiry">'+ico('record_voice_over','🔊')+'Vervaldatums voorlezen</button><button type="button" class="btn ghost" data-act="speakStop">Stop voorlezen</button></div>'}
function a11ySection(){const o=A11y.get();const can=A11y.canSpeak();const v=can?A11y.voice():null;
  const tg=(k,lbl,hint)=>'<label class="check a11y-opt"><input type="checkbox" data-change="a11ySet" data-k="'+k+'" '+(o[k]?'checked':'')+'><span><b>'+lbl+'</b><br><span class="small muted">'+hint+'</span></span></label>';
  return '<div class="section" data-glean-id="settings-a11y"><h3>Toegankelijkheid</h3>'+
  '<div class="lbl" style="margin-bottom:6px">Tekstgrootte</div><div class="seg" role="group" aria-label="Tekstgrootte">'+A11y.SIZES.map(s=>'<button type="button" data-act="a11ySize" data-s="'+s[0]+'" aria-pressed="'+(o.size===s[0])+'">'+s[1]+' <span class="small">'+s[2]+'</span></button>').join('')+'</div>'+
  '<div class="stack" style="margin-top:12px;gap:10px">'+tg('contrast','Hoog contrast','Donkerdere tekst, duidelijke randen rond knoppen en velden.')+tg('big','Grote knoppen','Knoppen en invoervelden worden groter en makkelijker aan te tikken.')+tg('motion','Minder beweging','Geen animaties of overgangen.')+
  (can?tg('speak','Voorlezen','Leest scanresultaten voor (product, opslagplaats, vervaldatum) en toont een knop om je vervaldatums te laten voorlezen.')+tg('speakToasts','Meldingen voorlezen','Leest ook korte meldingen onderaan het scherm voor.'):'<div class="note warn">Voorlezen wordt niet ondersteund in deze browser.</div>')+'</div>'+
  (can?'<div class="lbl" style="margin:12px 0 6px">Spreeksnelheid</div><div class="row"><div class="seg" role="group" aria-label="Spreeksnelheid">'+A11y.RATES.map(r=>'<button type="button" data-act="a11yRate" data-r="'+r[0]+'" aria-pressed="'+(Number(o.rate)===r[0])+'">'+r[1]+'</button>').join('')+'</div><button type="button" class="btn" data-act="a11yTest">'+ico('record_voice_over','🔊')+'Test</button></div><div class="hint" style="margin-top:6px">'+(v?'Stem: '+esc(v.name)+' ('+esc(v.lang)+').':'Geen Nederlandse stem gevonden op dit toestel — de standaardstem wordt gebruikt. Je kunt een Nederlandse stem toevoegen in de instellingen van je toestel (Spraak / Tekst-naar-spraak).')+'</div>':'')+
  '<div class="hint" style="margin-top:10px">Werkt ook samen met de schermlezer van je toestel (VoiceOver of TalkBack). De keuzes gelden per toestel.</div></div>'}
A.a11ySize=d=>{A11y.set('size',d.s);render();toast('Tekstgrootte: '+(A11y.SIZES.find(s=>s[0]===d.s)||[,''])[1].toLowerCase()+'.')};
A.a11ySet=(d,el)=>{A11y.set(d.k,!!el.checked);render();if(d.k==='speak'&&el.checked)A11y.speak('Voorlezen staat aan.',true)};
A.a11yRate=d=>{A11y.set('rate',Number(d.r));render();A11y.speak('Zo klinkt deze snelheid.',true)};
A.a11yTest=()=>{if(!A11y.speak('Hallo, dit is Provisio. Zo klinkt het voorlezen.',true))toast('Voorlezen lukte niet in deze browser.','error')};
/* meldingen voorlezen */
const _toastBase=toast;toast=function(m,k,a){_toastBase(m,k,a);try{if(A11y.get().speakToasts)A11y.speak(m,true)}catch(e){}};
/* naar-boven-knop */
const ToTop={el:null,
  target(){const ov=document.querySelector&&document.querySelector('#modal-root .overlay');return ov||null},
  offset(){const ov=ToTop.target();return ov?ov.scrollTop:(window.scrollY||window.pageYOffset||(document.documentElement&&document.documentElement.scrollTop)||0)},
  update(){if(!ToTop.el)return;const show=ToTop.offset()>400;if(ToTop.el.classList)ToTop.el.classList.toggle('show',show)},
  go(){const ov=ToTop.target();const beh=A11y.get().motion?'auto':'smooth';if(ov){try{ov.scrollTo({top:0,behavior:beh})}catch(e){ov.scrollTop=0}}else{try{window.scrollTo({top:0,behavior:beh})}catch(e){window.scrollTo(0,0)}}
    setTimeout(()=>{const f=ov?ov.querySelector('.modal [name],.modal button'):document.querySelector('#view h1,#view h2,#view button');if(f&&f.focus)try{f.focus({preventScroll:true})}catch(e){}ToTop.update()},350)},
  init(){try{if(ToTop.el||!document.body||!document.body.appendChild)return;const b=document.createElement('button');b.type='button';b.className='to-top';b.setAttribute('aria-label','Naar boven');b.innerHTML=ico('arrow_upward','⬆')+'<span>Naar boven</span>';b.onclick=()=>ToTop.go();document.body.appendChild(b);ToTop.el=b;
    document.addEventListener('scroll',()=>ToTop.update(),true);window.addEventListener('resize',()=>ToTop.update())}catch(e){}}};


boot().catch(function(e){console.error(e);document.getElementById('view').innerHTML='<div class="loading"><b>De app kon niet starten.</b><div class="small">'+String(e&&e.message||e)+'</div></div>'});
</script>
<script>
(function(){
  if(window.GleanBridge&&window.GleanBridge.postMessage){
    window.GleanBridge.postMessage({actionId:'export-pdf',type:'glean-add-menu',metadata:{label:'Export as PDF',icon:'export'}});
    window.GleanBridge.onMessage('action',function(data){if(data.actionId==='export-pdf')window.print();});
  }
  function prepareChartsForPrint(){if(!window.echarts)return;document.querySelectorAll('[_echarts_instance_]').forEach(function(el){var chart=echarts.getInstanceByDom(el);if(!chart)return;var img=new Image();img.src=chart.getDataURL({type:'png',pixelRatio:2});img.className='print-chart-img';img.style.cssText='width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;z-index:10;';el.dataset.prevPosition=el.style.position;el.style.position='relative';el.appendChild(img);});}
  function cleanUpAfterPrint(){document.querySelectorAll('.print-chart-img').forEach(function(img){var el=img.parentNode;img.remove();el.style.position=el.dataset.prevPosition||'';delete el.dataset.prevPosition;});}
  window.addEventListener('beforeprint',prepareChartsForPrint);window.addEventListener('afterprint',cleanUpAfterPrint);
})();
</script>
