# Provisio — werkt elke week de geneesmiddelenlijst (data/medicijnen.json) bij
# vanuit de openbare SAM-export. Handmatig starten: tabblad Actions › Medicijnenlijst bijwerken › Run workflow.
name: Medicijnenlijst bijwerken

on:
  schedule:
    - cron: "17 4 * * 1"   # elke maandag om 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medicijnenlijst
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SAM-export downloaden en omzetten
        run: python scripts/sam_medicijnen.py --out data/medicijnen.json

      - name: Opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/medicijnen.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de medicijnenlijst."
            exit 0
          fi
          git commit -m "Medicijnenlijst bijwerken (SAM-export)"
          git push
